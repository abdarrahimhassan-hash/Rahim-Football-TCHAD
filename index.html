<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Desk de Trading Football · QG</title>
<style>
:root{--bg:#0a0d14;--card:#141a24;--ink:#e2e8f0;--mut:#8b95a3;--line:#2a3340;--acc:#fb923c;--green:#4ade80;--red:#f87171;--blue:#38bdf8;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;overflow-x:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:linear-gradient(#0a0d14cc,#0a0d1400);z-index:10;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
#bar button{flex:none;background:#141a24dd;border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap;font-weight:600}
#bar button.h{background:var(--acc);color:#000;border-color:var(--acc)}
#bar button.bankroll-btn{background:#1e293b;color:var(--green);border-color:var(--green);display:flex;align-items:center;gap:6px}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff8;font-size:12px;pointer-events:none;z-index:5}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow-y:auto;background:var(--card);border-top:3px solid var(--acc);border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;max-width:800px;margin-inline:auto;z-index:20;box-shadow:0 -10px 40px #000c}
#sh.on{display:block;animation:up .2s ease}
@keyframes up{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hd input{font:inherit;font-weight:700;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.x{margin-left:auto;background:none;border:0;font-size:24px;color:var(--mut);padding:0 4px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 4px;font-weight:700}
#sh ul{margin:0;padding-left:18px;font-size:13px}
.m{padding:10px 14px;border-radius:12px;max-width:95%;white-space:pre-wrap;margin-top:8px;font-size:14px;line-height:1.55;border:1px solid transparent}
.m b{color:#fff;font-weight:700}
.m ul, .m ol{padding-left:18px;margin:6px 0}
.m li{margin-bottom:3px}
.me{margin-left:auto;background:var(--acc);color:#000;border-bottom-right-radius:4px}
.ai{background:#10151d;border-color:var(--line);border-bottom-left-radius:4px}
.sys{background:#1e242f;color:#a1aab8;font-size:12px;text-align:center;max-width:100%;border-radius:8px;margin:8px auto;padding:8px;border:1px dashed #333}
.row{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--card);padding-top:8px;padding-bottom:4px;z-index:2}
textarea{flex:1;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;resize:none;height:48px;max-height:120px}
input[type="text"], input[type="number"]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px;font:inherit}
.go{background:var(--acc);color:#000;border:0;border-radius:12px;padding:0 20px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s}
.go:disabled{opacity:.5;cursor:not-allowed}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:#1e242f;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;transition:.2s;font-weight:600}
.tag:hover{background:var(--acc);color:#000;border-color:var(--acc)}
.tool-box{background:#141a24;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;box-shadow:0 4px 15px #0005}
.tool-box h4{margin:0 0 10px 0;font-size:14px;color:var(--acc);display:flex;align-items:center;gap:6px}
.tool-box button{background:var(--acc);color:#000;font-weight:bold;border:none;border-radius:8px;padding:10px;width:100%;cursor:pointer;margin-top:4px}
.copy-btn{background:none;border:none;color:var(--mut);font-size:11px;margin-top:8px;cursor:pointer;text-decoration:underline;display:inline-block}
.clear-btn{background:none;border:1px solid var(--line);color:var(--mut);font-size:11px;padding:4px 8px;border-radius:6px;cursor:pointer;margin-left:auto}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-ok{color:var(--green);font-size:12px;margin-top:8px;display:block}
.status-err{color:var(--red);font-size:12px;margin-top:8px;display:block}
.typing::after{content:"▋";animation:blink 1s infinite;margin-left:2px;color:var(--acc)}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hint">Glisse pour tourner · pince pour zoomer · touche un employé</div>
<aside id="sh"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.textContent="Moteur 3D non chargé.";return}
const $=s=>document.querySelector(s),TAU=Math.PI*2;

/* ============ EXPERTS ============ */
const R=["Direction","Veille","Labo"],RX=[-9.3,0,9.3];
const TS=["Analyse ","Donne la proba exacte","Indique le scénario noir"];
const ts=(t,x)=>({r:2,t,m:["Analyse "+x,"Proba exacte","Scénario noir"],g:"Honnête.",sys:`Tu es l'Analyste Expert pour ${x}. Tu maîtrises l'Overround, le CLV, les xG et la fatigue. Sois direct et professionnel.`});

const A=[
{r:0,t:"Directeur Exécutif",f:"Stratège",m:["Décision finale","Arbitrage","Validation"],sys:"Tu es le Directeur Exécutif. Tu synthétises. Tu ne valides un pari que si l'EV est positif et que l'overround est < 6%. Tu parles avec autorité."},
{r:0,t:"Expert Value (EV/CLV)",f:"Mathématicien / Trader",m:["Calcule l'EV","Traque le CLV","Kelly"],sys:"Tu es le Parieur Pro. Tu ne jures que par l'Expected Value et la marge (overround). Tu recommandes des mises via Kelly. Tu détestes les paris émotifs.", tools:["kelly","overround"]},
{r:0,t:"Auditeur Promo",f:"Juriste",m:["Détecte les pièges","Calcule le rollover","Protège le capital"],sys:"Tu es l'Auditeur des conditions promo. Tu calcules les rollovers et vérifies les mises. Ton but est d'empêcher le piège.", tools:["rollover"]},
{r:1,t:"Scout Terrain",f:"Journaliste",m:["Blessures","Impact tactique","Zéro rumeur"],sys:"Tu es le Scout. Tu ne valides que les infos officielles. Analyse l'impact tactique d'une absence."},
{r:1,t:"Data Scientist",f:"Statisticien",m:["xG et xGA","Surperformance","Séries"],sys:"Tu es le Data Scientist. Tu ne regardes que les xG. Tu repères les équipes qui gagnent par chance."},
{r:1,t:"Trader Marché (LDP)",f:"Flux / LDP",m:["Mouvements de cotes","LDP","Alertes"],sys:"Tu es le Trader. Tu surveilles les baisses de cotes suspectes et l'argent intelligent (LDP).", tools:["overround"]},
ts("Testeur Liga","la Liga"),ts("Testeur Premier League","la Premier League"),ts("Testeur Ligue des champions","la Ligue des champions"),
{r:2,t:"Modélisateur",f:"Mathématicien",m:["Poisson","Over/Under","Scores"],sys:"Tu es le Mathématicien. Tu utilises la Loi de Poisson. Tu expliques tes calculs simplement.", tools:["poisson"]},
{r:2,t:"Scénariste (Risques)",f:"Pre-mortem",m:["Scénarios noirs","Résilience","Failles"],sys:"Tu es l'Analyste de risque. Ton rôle est d'imaginer le pire (blessure, carton rouge, terrain). Cherche les failles."}
];

/* ============ STATE ============ */
let N=["Abdarrahim","Abdoulaye","Abakar","Oumar","Marwan","Abdel Latif","Mahmoud","Abba","Elyou","Karim","Sofiane"];
let REP=null;
let BANK=parseFloat(localStorage.getItem("bn3_bank")||"10000");
const H={};
let API_KEY=localStorage.getItem("bn3_api_key")||"";
let API_MODEL=localStorage.getItem("bn3_api_model")||"google/gemini-2.0-flash-exp:free";

try{const s=JSON.parse(localStorage.getItem("bn3")||"null");if(Array.isArray(s)&&s.length===11)N=s;}catch(e){}
try{const r=JSON.parse(localStorage.getItem("bn3_infos")||"null");if(r&&typeof r==="object")REP=r;}catch(e){}
try{const c=JSON.parse(localStorage.getItem("bn3_chat")||"null");if(c&&typeof c==="object")Object.assign(H,c);}catch(e){}

const nm=i=>N[i]||"À nommer";
function saveNames(){try{localStorage.setItem("bn3",JSON.stringify(N));}catch(e){}}
function saveInfos(){try{localStorage.setItem("bn3_infos",JSON.stringify(REP));}catch(e){}}
function saveChat(){try{const t={};Object.keys(H).forEach(k=>{t[k]=H[k].slice(-15);});localStorage.setItem("bn3_chat",JSON.stringify(t));}catch(e){}}
function saveApi(){try{localStorage.setItem("bn3_api_key",API_KEY);localStorage.setItem("bn3_api_model",API_MODEL);}catch(e){}}
function saveBank(){try{localStorage.setItem("bn3_bank",BANK);}catch(e){}}

/* ---------- SCÈNE 3D (Trading) ---------- */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);const cv=ren.domElement;
const sc=new THREE.Scene(),SKY=0x0a0d14;sc.background=new THREE.Color(SKY);sc.fog=new THREE.Fog(SKY,30,90);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
sc.add(new THREE.HemisphereLight(0xffffff,0x333333,.6));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(5,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-22,right:22,top:14,bottom:-14,near:1,far:60});sc.add(sun);
RX.forEach((x,i)=>{const l=new THREE.PointLight([0xfb923c,0x38bdf8,0x8b5cf6][i],1.5,15);l.position.set(x,4,0);sc.add(l)});

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.2},o||{}));
function bx(w,h,d,c,x,y,z,o,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}
function cyl(r,h,c,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;sc.add(m);return m}
function ball(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c));m.position.set(x,y,z);m.castShadow=true;(p||sc).add(m);return m}

// Sol style Bourse
const fl=new THREE.Mesh(new THREE.PlaneGeometry(29,11),M(0x11161d,{roughness:.4,metalness:.6}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x0a0d14));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;sc.add(ground);
const RC=[0x331a0f,0x0f2533,0x1a0f33];
RX.forEach((x,i)=>{const r=new THREE.Mesh(new THREE.PlaneGeometry(6.5,4.2),M(RC[i],{roughness:.9}));r.rotation.x=-Math.PI/2;r.position.set(x,.01,i==0?2.5:i==1?2.2:2.6);r.receiveShadow=true;sc.add(r)});

// Murs
bx(29,4.6,.3,0x0f141b,0,2.3,-5.3);bx(.3,4.6,10.8,0x0f141b,-14.6,2.3,0);bx(.3,4.6,10.8,0x0f141b,14.6,2.3,0);bx(29,.15,.35,0x222,0,.07,-5.2);
[-4.6,4.6].forEach(x=>{bx(.08,3.2,10.5,0x38bdf8,x,1.6,0,{transparent:true,opacity:.1,roughness:.1});bx(.12,3.4,.12,0x111,x,1.7,-5);bx(.12,3.4,.12,0x111,x,1.7,5)});

// Écran géant
const sk=document.createElement("canvas");sk.width=1024;sk.height=420;const sg=sk.getContext("2d"),stex=new THREE.CanvasTexture(sk);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(6.6,2.7),new THREE.MeshBasicMaterial({map:stex}));scr.position.set(RX[0],2.4,-5.12);sc.add(scr);bx(6.8,2.9,.08,0x000000,RX[0],2.4,-5.18);
function drawScr(){
  sg.fillStyle="#0a0d14";sg.fillRect(0,0,1024,420);
  sg.fillStyle="#fb923c";sg.font="bold 44px monospace";sg.fillText("TRADING DESK",36,60);
  sg.fillStyle="#4ade80";sg.font="26px monospace";
  sg.fillText(REP&&REP.match? "LIVE: "+REP.match : "En attente des données...",36,98);
  if(REP&&REP.match){
    sg.fillStyle="#fff";sg.font="28px monospace";
    sg.fillText(`1: ${REP.c1||'-'} | X: ${REP.cx||'-'} | 2: ${REP.c2||'-'}`,36,150);
    sg.fillStyle="#fb923c";sg.fillText(`Overround estimé: ${calcOverround(REP.c1,REP.cx,REP.c2).over.toFixed(1)}%`,36,200);
    sg.fillStyle="#aaa";sg.font="22px monospace";sg.fillText(`Note: ${REP.note||'Aucune'}`,36,250);
  } else {
    sg.fillStyle="#666";sg.font="26px monospace";sg.fillText("Saisir les données dans INFOS DU JOUR",36,150);
  }
  stex.needsUpdate=true;
}
drawScr();

// Bureaux Trading (Double écran)
const scrs=[];
function desk(x,z){
  bx(2.2,.08,1.0,0x1a1f28,x,.76,z); // Plateau
  bx(.06,.72,.8,0x111,x-.9,.38,z);bx(.06,.72,.8,0x111,x+.9,.38,z); // Pieds
  // Double écran
  bx(.9,.55,.05,0x000,x-.4,1.2,z-.24); 
  const s1=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x1a3a3a}));s1.position.set(x-.4,1.2,z-.21);sc.add(s1);scrs.push(s1);
  bx(.9,.55,.05,0x000,x+.4,1.2,z-.24);
  const s2=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x2a1a1a}));s2.position.set(x+.4,1.2,z-.21);sc.add(s2);scrs.push(s2);
  bx(.6,.03,.2,0x000,x,.82,z+.15); // Clavier
  // Chaise
  bx(.55,.07,.55,0x111,x,.45,z+.9);bx(.55,.6,.07,0x111,x,.82,z+1.17);bx(.08,.4,.08,0x333,x,.22,z+.9);
}

const D=[[-11.8,-2.6],[-9.3,-2.6],[-6.8,-2.6],[-2.5,-2.6],[0,-2.6],[2.5,-2.6],[6.8,-2.6],[9.3,-2.6],[11.8,-2.6],[8.05,.9],[10.55,.9]];
D.forEach(d=>desk(d[0],d[1]));

// Personnages (Style Trader)
const SKN=[0x3b2416,0x5a3825,0x7a4a2e,0x9b6a45,0xc58f66],SHI=[0x111111,0x1a1a2e,0x0f2a3f,0x1f1a1a];
function limb(w,h,d,c,x,y,p){const g=new THREE.Group();g.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=-h/2;m.castShadow=true;g.add(m);p.add(g);return g}
function person(i){
  const g=new THREE.Group(),sk=SKN[i%5],boss=i==0,sh=boss?0x0a0a0a:SHI[i%4];
  const L=limb(.18,.8,.2,0x1a1f28,-.12,.8,g),Rr=limb(.18,.8,.2,0x1a1f28,.12,.8,g);
  bx(.5,.62,.28,sh,0,1.11,0,null,g);
  const AL=limb(.14,.56,.14,sh,-.33,1.4,g),AR=limb(.14,.56,.14,sh,.33,1.4,g);
  bx(.13,.1,.13,sk,0,-.6,0,null,AL);bx(.13,.1,.13,sk,0,-.6,0,null,AR);
  bx(.1,.12,.1,sk,0,1.46,0,null,g);ball(.19,sk,0,1.66,0,g);
  // Cheveux
  const h=new THREE.Mesh(new THREE.SphereGeometry(.205,16,10,0,TAU,0,Math.PI*.55),M(0x111));h.position.set(0,1.69,-.01);g.add(h);
  // Cravate (pour les traders)
  if(i<6) bx(.06,.3,.02,[0xff0000,0x0000ff,0xffd700,0x00ff00][i%4],0,1.2,.15,null,g);
  // Casque audio (pour certains)
  if(i%3==0){
    const band=new THREE.Mesh(new THREE.TorusGeometry(.2,.02,8,20,Math.PI),M(0x222));band.rotation.x=Math.PI/2;band.position.y=1.85;g.add(band);
    [-.2,.2].forEach(x=>{const cup=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.07,16),M(0x222));cup.rotation.z=Math.PI/2;cup.position.set(x,1.75,0);g.add(cup)});
  }
  g.traverse(o=>{o.userData.i=i});return{g,L,R:Rr,AL,AR};
}
const AG=A.map((a,i)=>{
  const p=person(i),d=D[i];
  p.g.position.set(d[0],-.33,d[1]+.85);p.g.rotation.y=Math.PI;sc.add(p.g);
  const k=document.createElement("canvas");k.width=256;k.height=64;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false,transparent:true}));sp.scale.set(1.7,.42,1);sp.position.y=2.15;sp.renderOrder=9;p.g.add(sp);
  Object.assign(p,{i,d,k,sp,st:"sit",t:6+Math.random()*10,q:[],ph:Math.random()*6,baseY:Math.PI});label(p);return p;
});
function label(p){const g=p.k.getContext("2d");g.clearRect(0,0,256,64);g.fillStyle="rgba(10,14,20,.85)";g.fillRect(6,10,244,44);g.fillStyle="#fff";g.font="bold 20px system-ui";g.textAlign="center";g.fillText(nm(p.i),128,38);p.sp.material.map.needsUpdate=true}
function sitPose(p){p.g.position.y=-.33;p.L.rotation.x=p.R.rotation.x=-1.45}
function standPose(p){p.g.position.y=0;p.L.rotation.x=p.R.rotation.x=0;p.AL.rotation.x=p.AR.rotation.x=0}
AG.forEach(p=>{sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1});
function go(p,x,z){p.q.push([x,z])}
function tick(p,dt,T){
  const g=p.g;
  if(p.st=="sit"){p.AL.rotation.x=-1+Math.sin(T*9+p.ph)*.1;p.AR.rotation.x=-1+Math.cos(T*8+p.ph)*.1;p.t-=dt;
    if(p.t<0){standPose(p);go(p,p.d[0],p.d[1]+1.7);go(p,p.d[0]+(Math.random()-.5),p.d[1]+2);p.st="walk";p.next="idle"}return}
  if(p.st=="idle"){p.t-=dt;g.rotation.y=p.baseY+Math.sin(T*.8+p.ph)*.25;
    if(p.t<0){go(p,p.d[0],p.d[1]+1.7);go(p,p.d[0],p.d[1]+.85);p.st="walk";p.next="sit"}return}
  const q=p.q[0];if(!q){if(p.next=="sit"){g.rotation.y=Math.PI;sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1;p.st="sit";p.t=8+Math.random()*14}else{p.baseY=g.rotation.y;p.st="idle";p.t=3+Math.random()*4}p.L.rotation.x=p.R.rotation.x=0;return}
  const dx=q[0]-g.position.x,dz=q[1]-g.position.z,d=Math.hypot(dx,dz);if(d<.08){p.q.shift();return}
  const a=Math.atan2(dx,dz);let df=a-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*9);
  const sp=Math.min(d,1.35*dt);g.position.x+=dx/d*sp;g.position.z+=dz/d*sp;p.ph+=dt*9;const s=Math.sin(p.ph)*.7;
  p.L.rotation.x=s;p.R.rotation.x=-s;p.AL.rotation.x=-s*.7;p.AR.rotation.x=s*.7;
}

/* Caméra */
let th=0,ph=.85,di=40,ddi=40,tg=new THREE.Vector3(0,1,0),ttg=tg.clone(),fol=-1;
const portrait=()=>innerWidth<innerHeight,ALL=()=>portrait()?70:38,ROOM=()=>portrait()?24:18;
function view(k){fol=-1;th=0;ph=.85;if(k<0){ttg.set(0,1,0);ddi=ALL()}else{ttg.set(RX[k],1,0);ddi=ROOM()}}
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",()=>{resize();if(fol<0)ddi=ALL()});resize();ddi=di=ALL();
const P=new Map();let dn=null,pd=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);dn=[e.clientX,e.clientY,Date.now()];pd=0});
cv.addEventListener("pointermove",e=>{const o=P.get(e.pointerId);if(!o)return;if(P.size==1){th-=(e.clientX-o[0])*.006;ph=Math.max(.2,Math.min(1.45,ph-(e.clientY-o[1])*.005))}P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)ddi=Math.max(5,Math.min(80,ddi*pd/d));pd=d}});

function formatText(txt){
  if(!txt) return "";
  let html = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  html = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  html = html.replace(/`([^`]+)`/g, "<code style='background:#222;padding:1px 4px;border-radius:3px;font-size:12px;color:#fb923c'>$1</code>");
  const lines = html.split("\n");
  let inList = false, inOl = false, result = [];
  for(let line of lines){
    const bullet = line.match(/^[\s]*[-•*]\s+(.*)$/);
    const numbered = line.match(/^[\s]*(\d+)[.)]\s+(.*)$/);
    if(bullet){ if(!inList){ result.push("<ul>"); inList=true; inOl=false; } result.push("<li>"+bullet[1]+"</li>"); }
    else if(numbered){ if(!inOl){ if(inList) result.push("</ul>"); result.push("<ol>"); inOl=true; inList=false; } result.push("<li>"+numbered[2]+"</li>"); }
    else { if(inList){ result.push("</ul>"); inList=false; } if(inOl){ result.push("</ol>"); inOl=false; } result.push(line); }
  }
  if(inList) result.push("</ul>");
  if(inOl) result.push("</ol>");
  return result.join("\n").replace(/\n/g, "<br>");
}

function showKellyTool(log){
  const box=document.createElement("div");box.className="m ai tool-box";

  <input type="number" id="k_cote" placeholder="Cote (ex: 2.10)" value="2.10">

window.calcKelly = function(btn){
  const cote = parseFloat(btn.parentNode.querySelector('#k_cote').value) || 0;
  const prob = (parseFloat(btn.parentNode.querySelector('#k_prob').value) || 0) / 100;
  const b = cote - 1; const q = 1 - prob; const f = (b * prob - q) / b;
  const res = btn.parentNode.querySelector('#k_result');
  if(f <= 0 || cote<=1) { res.innerHTML = "❌ <b>Ne pas parier.</b> Expected Value négatif."; return; }
  const mise = Math.round(BANK * f * 0.5);
  res.innerHTML = `✅ Mise conseillée : <b>${mise.toLocaleString()} FCFA</b><br><small>Edge: +${(f*100).toFixed(1)}% · Full Kelly: ${Math.round(BANK*f).toLocaleString()}</small>`;
};

function showPoissonTool(log){
  const box=document.createElement("div");box.className="m ai tool-box";
  box.innerHTML=`<h4>🧮 Loi de Poisson</h4>
  <input type="number" step="0.1" id="p_home" placeholder="xG Domicile (ex: 1.5)" value="1.5">
  <input type="number" step="0.1" id="p_away" placeholder="xG Extérieur (ex: 1.2)" value="1.2">
  <button onclick="window.calcPoisson(this)">Calculer</button>
  <div id="p_result" style="margin-top:12px;font-weight:bold;color:var(--green);font-size:13px;line-height:1.6"></div>`;
  log.append(box); sh.scrollTop=sh.scrollHeight;
}
window.calcPoisson = function(btn){
  const h = parseFloat(btn.parentNode.querySelector('#p_home').value) || 0;
  const a = parseFloat(btn.parentNode.querySelector('#p_away').value) || 0;
  const fact = n => { let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
  const poisson = (k, lambda) => (Math.pow(lambda, k) * Math.exp(-lambda)) / fact(k);
  let p1=0, pX=0, p2=0, pOver=0, pUnder=0;
  for(let i=0; i<=6; i++) for(let j=0; j<=6; j++){
    const prob = poisson(i,h)*poisson(j,a);
    if(i>j) p1+=prob; else if(i===j) pX+=prob; else p2+=prob;
    if(i+j > 2.5) pOver+=prob; else pUnder+=prob;
  }
  const res = btn.parentNode.querySelector('#p_result');
  res.innerHTML = `
  <b>1X2</b><br>Victoire Domicile : <b>${(p1*100).toFixed(1)}%</b><br>Match Nul : <b>${(pX*100).toFixed(1)}%</b><br>Victoire Extérieur : <b>${(p2*100).toFixed(1)}%</b><br><br>
  <b>Buts</b><br>Over 2.5 : <b>${(pOver*100).toFixed(1)}%</b> · Under 2.5 : <b>${(pUnder*100).toFixed(1)}%</b>`;
};

function showOverroundTool(log){
  const box=document.createElement("div");box.className="m ai tool-box";
  box.innerHTML=`<h4>🧮 Overround (Marge Bookmaker)</h4>
  <div class="grid-2">
    <input type="number" step="0.01" id="o_c1" placeholder="Cote 1" value="2.10">
    <input type="number" step="0.01" id="o_cx" placeholder="Cote X" value="3.40">
  </div>
  <input type="number" step="0.01" id="o_c2" placeholder="Cote 2" value="3.50">
  <button onclick="window.calcOverround2(this)">Calculer la marge</button>
  <div id="o_result" style="margin-top:12px;font-weight:bold;color:var(--green);font-size:13px;line-height:1.6"></div>`;

function calcOverround(c1,cx,c2){
  if(!c1||!cx||!c2||c1<=1||cx<=1||c2<=1) return {over:0, p1:0, px:0, p2:0};
  const i1=1/c1, ix=1/cx, i2=1/c2; const sum=i1+ix+i2;
  return { over:(sum-1)*100, p1:(i1/sum)*100, px:(ix/sum)*100, p2:(i2/sum)*100 };
}
window.calcOverround2 = function(btn){
  const c1=parseFloat(btn.parentNode.querySelector('#o_c1').value)||0;
  const cx=parseFloat(btn.parentNode.querySelector('#o_cx').value)||0;
  const c2=parseFloat(btn.parentNode.querySelector('#o_c2').value)||0;
  const res=btn.parentNode.querySelector('#o_result');
  const r=calcOverround(c1,cx,c2);
  if(!r.over && r.over!==0){ res.innerHTML="❌ Cotes invalides."; return; }
  let q = r.over < 4 ? "🟢 Excellent" : r.over < 6 ? "🟡 Correct" : "🔴 Élevé";
  res.innerHTML = `<b>Marge : ${r.over.toFixed(2)}%</b> ${q}<br><br>
  <b>Proba nette :</b><br>1: <b>${r.p1.toFixed(1)}%</b> | X: <b>${r.px.toFixed(1)}%</b> | 2: <b>${r.p2.toFixed(1)}%</b>`;
};

      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json", "HTTP-Referer": location.origin, "X-Title": "Desk Trading" },
        body: JSON.stringify({ model: m, messages: messages, temperature: 0.6, stream: true })
      });

      if (!res.ok) {
        if(res.status === 429) { lastError = "Modèle saturé (429). Bascule..."; continue; }
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error?.message || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = ""; let buffer = "";
      w.classList.add("typing"); w.textContent = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content || "";
            if (content) { full += content; w.innerHTML = formatText(full); sh.scrollTop = sh.scrollHeight; }
          } catch (e) {}
        }
      }
      
      w.classList.remove("typing");
      if (!full.trim()) throw new Error("Réponse vide");
      w.innerHTML = formatText(full);
      addCopyBtn(w, full);
      H[i].push(["ai", full]);
      saveChat();
      success = true;
      break;
    } catch(e) {
      lastError = e.message;
      w.textContent = `⚠️ Erreur (${m.split('/')[1]}). Bascule...`;
    }
  }

  if(!success) {
    w.classList.remove("typing");
    w.innerHTML = "⚠️ <b>Échec de tous les modèles.</b> " + lastError;
    w.style.color = "#f87171";
  }
  btn.disabled = false;
  sh.scrollTop = sh.scrollHeight;
}
})();
</script>
</body>
</html>
