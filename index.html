<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Desk de Trading Football · QG 3D</title>
<style>
:root{--bg:#0f172a;--card:rgba(30, 41, 59, 0.85);--ink:#f8fafc;--mut:#94a3b8;--line:#334155;--acc:#f97316;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;overflow-x:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:linear-gradient(#0f172acc,#0f172a00);z-index:10;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
#bar button{flex:none;background:rgba(30,41,59,.8);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:600;transition:.2s}
#bar button:hover{background:var(--line)}
#bar button.h{background:var(--acc);color:#fff;border-color:var(--acc)}
#bar button.bankroll-btn{background:#1e293b;color:var(--green);border-color:var(--green);display:flex;align-items:center;gap:6px}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;text-shadow:0 2px 4px #000;font-size:12px;pointer-events:none;z-index:5;font-weight:600}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow-y:auto;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--acc);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;max-width:800px;margin-inline:auto;z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,0.5)}
#sh.on{display:block;animation:up .3s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px}
.hd input{font:inherit;font-weight:800;font-size:16px;width:100%;background:rgba(0,0,0,0.2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.x{margin-left:auto;background:rgba(255,255,255,0.1);border:0;font-size:20px;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:.2s}
.x:hover{background:var(--red)}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:14px 0 6px;font-weight:800}
#sh ul{margin:0;padding-left:18px;font-size:13px;color:var(--mut)}
.m{padding:12px 16px;border-radius:14px;max-width:95%;white-space:pre-wrap;margin-top:10px;font-size:14px;line-height:1.6;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.m b{color:#fff;font-weight:700}
.m ul, .m ol{padding-left:18px;margin:8px 0}
.m li{margin-bottom:4px}
.me{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:2px}
.ai{background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.05);border-bottom-left-radius:2px}
.sys{background:rgba(0,0,0,0.3);color:var(--mut);font-size:12px;text-align:center;border-radius:8px;margin:10px auto;padding:10px;border:1px dashed var(--line)}
.row{display:flex;gap:10px;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding-top:10px;padding-bottom:4px;z-index:2}
textarea{flex:1;font:inherit;background:rgba(0,0,0,0.3);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;height:50px;max-height:120px}
textarea:focus{outline:none;border-color:var(--acc)}
input[type="text"], input[type="number"], input[type="password"]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,0.2);color:var(--ink);margin-bottom:10px;font:inherit;font-weight:600}
input:focus{outline:none;border-color:var(--acc)}
select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:var(--ink);margin-bottom:10px;font:inherit}
.go{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 20px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s}
.go:active{transform:scale(0.95)}
.go:disabled{opacity:.5;cursor:not-allowed}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:#cbd5e1;cursor:pointer;transition:.2s;font-weight:600}
.tag:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.tool-box{background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.tool-box h4{margin:0 0 12px 0;font-size:14px;color:var(--acc);display:flex;align-items:center;gap:8px}
.tool-box button{background:var(--acc);color:#fff;font-weight:bold;border:none;border-radius:8px;padding:12px;width:100%;cursor:pointer;transition:.2s}
.copy-btn{background:none;border:none;color:var(--mut);font-size:11px;margin-top:10px;cursor:pointer;text-decoration:underline;display:inline-block}
.clear-btn{background:none;border:1px solid var(--line);color:var(--mut);font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;margin-left:auto}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-ok{color:var(--green);font-size:12px;margin-top:10px;display:block;font-weight:bold}
.status-err{color:var(--red);font-size:12px;margin-top:10px;display:block;font-weight:bold}
.typing::after{content:"▋";animation:blink 1s infinite;margin-left:2px;color:var(--acc)}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hint">Glisse pour tourner · Clique sur un employé</div>
<aside id="sh"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.textContent="Moteur 3D non chargé.";return}
const $=s=>document.querySelector(s),TAU=Math.PI*2;

/* ============ EXPERTS ============ */
const R=["Direction","Veille","Labo"],RX=[-9.3,0,9.3];
const TS=["Analyse ","Donne la proba exacte","Indique le scénario noir"];
const ts=(t,x)=>({r:2,t,m:["Analyse "+x,"Proba exacte","Scénario noir"],g:"Honnête.",sys:`Tu es l'Analyste Expert pour ${x}. Tu maîtrises l'Overround, le CLV, les xG et la fatigue. Sois direct et professionnel.`});

const A=[
{r:0,t:"Directeur Exécutif",f:"Stratège",m:["Décision finale","Arbitrage","Validation"],sys:"Tu es le Directeur Exécutif. Tu synthétises. Tu ne valides un pari que si l'EV est positif et que l'overround est < 6%. Tu parles avec autorité."},
{r:0,t:"Expert Value (EV/CLV)",f:"Mathématicien / Trader",m:["Calcule l'EV","Traque le CLV","Kelly"],sys:"Tu es le Parieur Pro. Tu ne jures que par l'Expected Value et la marge (overround). Tu recommandes des mises via Kelly. Tu détestes les paris émotifs.", tools:["kelly","overround"]},
{r:0,t:"Auditeur Promo",f:"Juriste",m:["Détecte les pièges","Calcule le rollover","Protège le capital"],sys:"Tu es l'Auditeur des conditions promo. Tu calcules les rollovers et vérifies les mises. Ton but est d'empêcher le piège.", tools:["rollover"]},
{r:1,t:"Scout Terrain",f:"Journaliste",m:["Blessures","Impact tactique","Zéro rumeur"],sys:"Tu es le Scout. Tu ne valides que les infos officielles. Analyse l'impact tactique d'une absence."},
{r:1,t:"Data Scientist",f:"Statisticien",m:["xG et xGA","Surperformance","Séries"],sys:"Tu es le Data Scientist. Tu ne regardes que les xG. Tu repères les équipes qui gagnent par chance."},
{r:1,t:"Trader Marché (LDP)",f:"Flux / LDP",m:["Mouvements de cotes","LDP","Alertes"],sys:"Tu es le Trader. Tu surveilles les baisses de cotes suspectes et l'argent intelligent (LDP).", tools:["overround"]},
ts("Testeur Liga","la Liga"),ts("Testeur Premier League","la Premier League"),ts("Testeur Ligue des champions","la Ligue des champions"),
{r:2,t:"Modélisateur",f:"Mathématicien",m:["Poisson","Over/Under","Scores"],sys:"Tu es le Mathématicien. Tu utilises la Loi de Poisson. Tu expliques tes calculs simplement.", tools:["poisson"]},
{r:2,t:"Scénariste (Risques)",f:"Pre-mortem",m:["Scénarios noirs","Résilience","Failles"],sys:"Tu es l'Analyste de risque. Ton rôle est d'imaginer le pire (blessure, carton rouge, terrain). Cherche les failles."}
];

/* ============ STATE ============ */
let N=["Abdarrahim","Abdoulaye","Abakar","Oumar","Marwan","Abdel Latif","Mahmoud","Abba","Elyou","Karim","Sofiane"];
let REP=null;
let BANK=parseFloat(localStorage.getItem("bn3_bank")||"10000");
const H={};
let API_KEY=localStorage.getItem("bn3_api_key")||"";
let API_MODEL=localStorage.getItem("bn3_api_model")||"google/gemini-2.0-flash-exp:free";
let DEMO_MODE = localStorage.getItem("bn3_demo")==="1";

try{const s=JSON.parse(localStorage.getItem("bn3")||"null");if(Array.isArray(s)&&s.length===11)N=s;}catch(e){}
try{const r=JSON.parse(localStorage.getItem("bn3_infos")||"null");if(r&&typeof r==="object")REP=r;}catch(e){}
try{const c=JSON.parse(localStorage.getItem("bn3_chat")||"null");if(c&&typeof c==="object")Object.assign(H,c);}catch(e){}

const nm=i=>N[i]||"À nommer";
function saveNames(){try{localStorage.setItem("bn3",JSON.stringify(N));}catch(e){}}
function saveInfos(){try{localStorage.setItem("bn3_infos",JSON.stringify(REP));}catch(e){}}
function saveChat(){try{const t={};Object.keys(H).forEach(k=>{t[k]=H[k].slice(-15);});localStorage.setItem("bn3_chat",JSON.stringify(t));}catch(e){}}
function saveApi(){try{localStorage.setItem("bn3_api_key",API_KEY);localStorage.setItem("bn3_api_model",API_MODEL);localStorage.setItem("bn3_demo",DEMO_MODE?"1":"0");}catch(e){}}
function saveBank(){try{localStorage.setItem("bn3_bank",BANK);}catch(e){}}

/* ---------- SCÈNE 3D CORRIGÉE (LUMINEUSE) ---------- */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);const cv=ren.domElement;
const sc=new THREE.Scene();
sc.background=new THREE.Color(0x1e293b); // Fond bleu-gris clair
sc.fog=new THREE.Fog(0x1e293b, 20, 70);

const cam=new THREE.PerspectiveCamera(45,1,.1,200);

// LUMIÈRES
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
sc.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
sc.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
sc.add(dirLight);

// Lumières d'accentuation par salle
RX.forEach((x,i)=>{
  const spot = new THREE.PointLight([0xf97316, 0x3b82f6, 0x8b5cf6][i], 1.5, 20);
  spot.position.set(x, 5, 0);
  sc.add(spot);
});

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.2},o||{}));
function bx(w,h,d,c,x,y,z,o,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}
function cyl(r,h,c,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;sc.add(m);return m}
function ball(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c));m.position.set(x,y,z);m.castShadow=true;(p||sc).add(m);return m}

// SOL VISIBLE ET TEXTURÉ
const floorMat = new THREE.MeshStandardMaterial({color:0x334155, roughness:0.4, metalness:0.1});
const fl=new THREE.Mesh(new THREE.PlaneGeometry(29,11), floorMat);
fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);

// Grille sur le sol pour l'effet "High Tech"
const grid = new THREE.GridHelper(29, 20, 0x475569, 0x1e293b);
grid.position.y = 0.02;
sc.add(grid);

// MURS VISIBLES
const wallMat = M(0x475569, {roughness:0.8});
bx(29,5,.3,0x475569,0,2.5,-5.3);
bx(.3,5,11,0x475569,-14.6,2.5,0);
bx(.3,5,11,0x475569,14.6,2.5,0);
bx(29,.15,.35,0x1e293b,0,.07,-5.2);

// TAPIS DE COULEUR
const RC=[0x7c2d12,0x1e3a8a,0x4c1d95];
RX.forEach((x,i)=>{const r=new THREE.Mesh(new THREE.PlaneGeometry(7,5),M(RC[i],{roughness:.9}));r.rotation.x=-Math.PI/2;r.position.set(x,.03,i==0?2.5:i==1?2.2:2.6);r.receiveShadow=true;sc.add(r)});

// ÉCRAN GÉANT
const sk=document.createElement("canvas");sk.width=1024;sk.height=420;const sg=sk.getContext("2d"),stex=new THREE.CanvasTexture(sk);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(6.6,2.7),new THREE.MeshBasicMaterial({map:stex}));scr.position.set(RX[0],2.8,-5.1);sc.add(scr);bx(6.8,2.9,.08,0x000000,RX[0],2.8,-5.18);
function drawScr(){
  sg.fillStyle="#0f172a";sg.fillRect(0,0,1024,420);
  sg.fillStyle="#f97316";sg.font="bold 44px monospace";sg.fillText("TRADING DESK",36,60);
  sg.fillStyle="#22c55e";sg.font="26px monospace";
  sg.fillText(REP&&REP.match? "LIVE: "+REP.match : "En attente des données...",36,98);
  if(REP&&REP.match){
    sg.fillStyle="#fff";sg.font="28px monospace";
    sg.fillText(`1: ${REP.c1||'-'} | X: ${REP.cx||'-'} | 2: ${REP.c2||'-'}`,36,150);
    sg.fillStyle="#f97316";sg.fillText(`Marge: ${calcOverround(REP.c1,REP.cx,REP.c2).over.toFixed(1)}%`,36,200);
    sg.fillStyle="#94a3b8";sg.font="22px monospace";sg.fillText(`Note: ${REP.note||'Aucune'}`,36,250);
  } else {
    sg.fillStyle="#64748b";sg.font="26px monospace";sg.fillText("Saisir les données dans INFOS DU JOUR",36,150);
  }
  stex.needsUpdate=true;
}
drawScr();

// BUREAUX
const scrs=[];
function desk(x,z){
  // Plateau
  bx(2.2,.1,1.1,0x1e293b,x,.76,z);
  // Pieds
  bx(.1,.72,.9,0x0f172a,x-1,.36,z);bx(.1,.72,.9,0x0f172a,x+1,.36,z);
  // Double écrans
  bx(.9,.55,.05,0x000000,x-.4,1.2,z-.24); 
  const s1=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x1e3a8a}));s1.position.set(x-.4,1.2,z-.21);sc.add(s1);scrs.push(s1);
  bx(.9,.55,.05,0x000000,x+.4,1.2,z-.24);
  const s2=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x7c2d12}));s2.position.set(x+.4,1.2,z-.21);sc.add(s2);scrs.push(s2);
  // Clavier
  bx(.6,.03,.2,0x000000,x,.82,z+.2); 
  // Chaise
  bx(.6,.1,.6,0x0f172a,x,.45,z+.9);bx(.6,.7,.1,0x0f172a,x,.8,z+1.2);bx(.1,.4,.1,0x475569,x,.2,z+.9);
}

const D=[[-11.8,-2.6],[-9.3,-2.6],[-6.8,-2.6],[-2.5,-2.6],[0,-2.6],[2.5,-2.6],[6.8,-2.6],[9.3,-2.6],[11.8,-2.6],[8.05,.9],[10.55,.9]];
D.forEach(d=>desk(d[0],d[1]));

// PERSONNAGES (Style Trader Pro)
const SKN=[0xfcd34d,0xfbbf24,0x78350f,0x451a03,0x1c1917],SHI=[0x1e293b,0x0f172a,0x334155,0x111827];
function limb(w,h,d,c,x,y,p){const g=new THREE.Group();g.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=-h/2;m.castShadow=true;g.add(m);p.add(g);return g}
function person(i){
  const g=new THREE.Group(),sk=SKN[i%5],boss=i==0,sh=boss?0x000000:SHI[i%4];
  const L=limb(.2,.8,.22,0x1e293b,-.13,.8,g),Rr=limb(.2,.8,.22,0x1e293b,.13,.8,g);
  bx(.55,.65,.3,sh,0,1.12,0,null,g);
  const AL=limb(.15,.58,.15,sh,-.36,1.42,g),AR=limb(.15,.58,.15,sh,.36,1.42,g);
  bx(.14,.1,.14,sk,0,-.62,0,null,AL);bx(.14,.1,.14,sk,0,-.62,0,null,AR);
  bx(.12,.14,.12,sk,0,1.5,0,null,g);ball(.21,sk,0,1.72,0,g);
  // Cheveux / Casque
  if(i%3==0){
    const band=new THREE.Mesh(new THREE.TorusGeometry(.22,.03,8,20,Math.PI),M(0x000000));band.rotation.x=Math.PI/2;band.position.y=1.88;g.add(band);
    [-.22,.22].forEach(x=>{const cup=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.08,16),M(0x000000));cup.rotation.z=Math.PI/2;cup.position.set(x,1.72,0);g.add(cup)});
  } else {
    const h=new THREE.Mesh(new THREE.SphereGeometry(.22,16,10,0,TAU,0,Math.PI*.55),M(0x111111));h.position.set(0,1.75,-.02);g.add(h);
  }
  // Cravate
  if(i<6) bx(.08,.35,.02,[0xef4444,0x3b82f6,0xfbbf24,0x22c55e][i%4],0,1.2,.16,null,g);
  
  g.traverse(o=>{o.userData.i=i});return{g,L,R:Rr,AL,AR};
}
const AG=A.map((a,i)=>{
  const p=person(i),d=D[i];
  p.g.position.set(d[0],-.33,d[1]+.85);p.g.rotation.y=Math.PI;sc.add(p.g);
  const k=document.createElement("canvas");k.width=256;k.height=64;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false,transparent:true}));sp.scale.set(2,.5,1);sp.position.y=2.3;sp.renderOrder=9;p.g.add(sp);
  Object.assign(p,{i,d,k,sp,st:"sit",t:6+Math.random()*10,q:[],ph:Math.random()*6,baseY:Math.PI});label(p);return p;
});
function label(p){
  const g=p.k.getContext("2d");g.clearRect(0,0,256,64);
  g.fillStyle="rgba(15,23,42,.9)";g.beginPath();g.roundRect(6,10,244,44,8);g.fill();
  g.strokeStyle="#f97316";g.lineWidth=2;g.stroke();
  g.fillStyle="#fff";g.font="bold 22px system-ui";g.textAlign="center";g.fillText(nm(p.i),128,40);
  p.sp.material.map.needsUpdate=true;
}
function sitPose(p){p.g.position.y=-.33;p.L.rotation.x=p.R.rotation.x=-1.45}
function standPose(p){p.g.position.y=0;p.L.rotation.x=p.R.rotation.x=0;p.AL.rotation.x=p.AR.rotation.x=0}
AG.forEach(p=>{sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1});
function go(p,x,z){p.q.push([x,z])}
function tick(p,dt,T){
  const g=p.g;
  if(p.st=="sit"){p.AL.rotation.x=-1+Math.sin(T*9+p.ph)*.1;p.AR.rotation.x=-1+Math.cos(T*8+p.ph)*.1;p.t-=dt;
    if(p.t<0){standPose(p);go(p,p.d[0],p.d[1]+1.7);go(p,p.d[0]+(Math.random()-.5),p.d[1]+2);p.st="walk";p.next="idle"}return}
  if(p.st=="idle"){p.t-=dt;g.rotation.y=p.baseY+Math.sin(T*.8+p.ph)*.25;
    if(p.t<0){go(p,p.d[0],p.d[1]+1.7);go(p,p.d[0],p.d[1]+.85);p.st="walk";p.next="sit"}return}
  const q=p.q[0];if(!q){if(p.next=="sit"){g.rotation.y=Math.PI;sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1;p.st="sit";p.t=8+Math.random()*14}else{p.baseY=g.rotation.y;p.st="idle";p.t=3+Math.random()*4}p.L.rotation.x=p.R.rotation.x=0;return}
  const dx=q[0]-g.position.x,dz=q[1]-g.position.z,d=Math.hypot(dx,dz);if(d<.08){p.q.shift();return}
  const a=Math.atan2(dx,dz);let df=a-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*9);
  const sp=Math.min(d,1.35*dt);g.position.x+=dx/d*sp;g.position.z+=dz/d*sp;p.ph+=dt*9;const s=Math.sin(p.ph)*.7;
  p.L.rotation.x=s;p.R.rotation.x=-s;p.AL.rotation.x=-s*.7;p.AR.rotation.x=s*.7;
}

cv.addEventListener("pointermove",e=>{const o=P.get(e.pointerId);if(!o)return;if(P.size==1){th-=(e.clientX-o[0])*.006;ph=Math.max(.2,Math.min(1.45,ph-(e.clientY-o[1])*.005))}P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)ddi=Math.max(8,Math.min(80,ddi*pd/d));pd=d}});
cv.addEventListener("pointerup",e=>{P.delete(e.pointerId);pd=0;if(dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<7&&Date.now()-dn[2]<450)pick(e);dn=null});

  rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);

function formatText(txt){
  if(!txt) return "";
  let html = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  html = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  html = html.replace(/`([^`]+)`/g, "<code style='background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;font-size:12px;color:#f97316'>$1</code>");
  const lines = html.split("\n");
  let inList = false, result = [];
  for(let line of lines){
    const bullet = line.match(/^[\s]*[-•*]\s+(.*)$/);
    if(bullet){ if(!inList){ result.push("<ul>"); inList=true; } result.push("<li>"+bullet[1]+"</li>"); }
    else { if(inList){ result.push("</ul>"); inList=false; } result.push(line); }
  }
  if(inList) result.push("</ul>");
  return result.join("\n").replace(/\n/g, "<br>");
}

window.calcKelly = function(btn){
  const cote = parseFloat(btn.parentNode.querySelector('#k_cote').value) || 0;
  const prob = (parseFloat(btn.parentNode.querySelector('#k_prob').value) || 0) / 100;
  const b = cote - 1; const q = 1 - prob; const f = (b * prob - q) / b;
  const res = btn.parentNode.querySelector('#k_result');
  if(f <= 0 || cote<=1) { res.innerHTML = "❌ <b>Ne pas parier.</b> EV négatif."; return; }
  const mise = Math.round(BANK * f * 0.5);
  res.innerHTML = `✅ Mise : <b>${mise.toLocaleString()} F</b><br><small>Edge: +${(f*100).toFixed(1)}%</small>`;
};

function showPoissonTool(log){
  const box=document.createElement("div");box.className="m ai tool-box";
  box.innerHTML=`<h4>🧮 Loi de Poisson</h4>
  <input type="number" step="0.1" id="p_home" placeholder="xG Domicile (ex: 1.5)" value="1.5">
  <input type="number" step="0.1" id="p_away" placeholder="xG Extérieur (ex: 1.2)" value="1.2">
  <button onclick="window.calcPoisson(this)">Calculer</button>
  <div id="p_result" style="margin-top:10px;font-weight:bold;color:var(--green);font-size:13px;line-height:1.6"></div>`;
  log.append(box); sh.scrollTop=sh.scrollHeight;
}
window.calcPoisson = function(btn){
  const h = parseFloat(btn.parentNode.querySelector('#p_home').value) || 0;
  const a = parseFloat(btn.parentNode.querySelector('#p_away').value) || 0;
  const fact = n => { let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
  const poisson = (k, lambda) => (Math.pow(lambda, k) * Math.exp(-lambda)) / fact(k);
  let p1=0, pX=0, p2=0, pOver=0;
  for(let i=0; i<=6; i++) for(let j=0; j<=6; j++){
    const prob = poisson(i,h)*poisson(j,a);
    if(i>j) p1+=prob; else if(i===j) pX+=prob; else p2+=prob;
    if(i+j > 2.5) pOver+=prob;
  }
  const res = btn.parentNode.querySelector('#p_result');
  res.innerHTML = `1: <b>${(p1*100).toFixed(1)}%</b> | X: <b>${(pX*100).toFixed(1)}%</b> | 2: <b>${(p2*100).toFixed(1)}%</b><br>Over 2.5: <b>${(pOver*100).toFixed(1)}%</b>`;
};

  const roll = parseFloat(btn.parentNode.querySelector('#r_roll').value) || 0;

function showOverroundTool(log){

function calcOverround(c1,cx,c2){
  if(!c1||!cx||!c2||c1<=1||cx<=1||c2<=1) return {over:0, p1:0, px:0, p2:0};
  const i1=1/c1, ix=1/cx, i2=1/c2; const sum=i1+ix+i2;
  return { over:(sum-1)*100, p1:(i1/sum)*100, px:(ix/sum)*100, p2:(i2/sum)*100 };
}
window.calcOverround2 = function(btn){
  const c1=parseFloat(btn.parentNode.querySelector('#o_c1').value)||0;

  const c2=parseFloat(btn.parentNode.querySelector('#o_c2').value)||0;
  const res=btn.parentNode.querySelector('#o_result');
  const r=calcOverround(c1,cx,c2);
  res.innerHTML = `<b>Marge : ${r.over.toFixed(2)}%</b><br>1: ${r.p1.toFixed(1)}% | X: ${r.px.toFixed(1)}% | 2: ${r.p2.toFixed(1)}%`;
};

        method: "POST",
        headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json", "HTTP-Referer": location.origin, "X-Title": "Desk Trading" },
        body: JSON.stringify({ model: m, messages: messages, temperature: 0.6, stream: true })
      });

      if (!res.ok) {
        if(res.status === 429) { lastError = "Modèle saturé (429). Bascule..."; continue; }
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error?.message || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = ""; let buffer = "";
      w.classList.add("typing"); w.textContent = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content || "";
            if (content) { full += content; w.innerHTML = formatText(full); sh.scrollTop = sh.scrollHeight; }
          } catch (e) {}
        }
      }
      
      w.classList.remove("typing");
      if (!full.trim()) throw new Error("Réponse vide");
      w.innerHTML = formatText(full);
      addCopyBtn(w, full);
      H[i].push(["ai", full]);
      saveChat();
      success = true;
      break;
    } catch(e) {
      lastError = e.message;
      w.textContent = `⚠️ Erreur (${m.split('/')[1]}). Bascule...`;
    }
  }

  if(!success) {
    w.classList.remove("typing");
    w.innerHTML = "⚠️ <b>Échec de tous les modèles.</b> " + lastError;
    w.style.color = "#ef4444";
  }
  btn.disabled = false;
  sh.scrollTop = sh.scrollHeight;
}
})();
</script>
</body>
</html>
