<!DOCTYPE html>
<html lang="fr">
<head>

<style>
:root{--bg:#0f172a;--card:rgba(30, 41, 59, 0.95);--ink:#f8fafc;--mut:#94a3b8;--line:#334155;--acc:#f97316;--green:#22c55e;--red:#ef4444;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

#sh{position:fixed;left:0;right:0;bottom:0;height:85vh;overflow-y:auto;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:2px solid var(--acc);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;max-width:800px;margin-inline:auto;z-index:20;box-shadow:0 -10px 50px rgba(0,0,0,0.6)}
#sh.on{display:flex;flex-direction:column;animation:up .3s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px;flex:none}
.hd input{font:inherit;font-weight:800;font-size:16px;width:100%;background:rgba(0,0,0,0.2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.x{margin-left:auto;background:rgba(255,255,255,0.1);border:0;font-size:20px;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:.2s}
.x:hover{background:var(--red)}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:14px 0 6px;font-weight:800;flex:none}
#sh ul{margin:0;padding-left:18px;font-size:13px;color:var(--mut)}
#log-container{flex:1;overflow-y:auto;padding-bottom:10px}
.m{padding:12px 16px;border-radius:14px;max-width:95%;white-space:pre-wrap;margin-top:10px;font-size:14px;line-height:1.6;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.m b{color:#fff;font-weight:700}
.m ul, .m ol{padding-left:18px;margin:8px 0}
.m li{margin-bottom:4px}
.me{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:2px}
.ai{background:rgba(15,23,42,0.9);border:1px solid rgba(255,255,255,0.05);border-bottom-left-radius:2px}
.sys{background:rgba(0,0,0,0.3);color:var(--mut);font-size:12px;text-align:center;border-radius:8px;margin:10px auto;padding:10px;border:1px dashed var(--line)}
.row{display:flex;gap:10px;margin-top:auto;padding-top:12px;background:var(--card);flex:none}
textarea{flex:1;font:inherit;background:rgba(0,0,0,0.3);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;height:50px;max-height:120px}
textarea:focus{outline:none;border-color:var(--acc)}
input[type="text"], input[type="number"], input[type="password"]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,0.2);color:var(--ink);margin-bottom:10px;font:inherit;font-weight:600}
select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:var(--ink);margin-bottom:10px;font:inherit}
.go{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 20px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s}

.status-ok{color:var(--green);font-size:12px;margin-top:10px;display:block;font-weight:bold}
.status-err{color:var(--red);font-size:12px;margin-top:10px;display:block;font-weight:bold}
.typing::after{content:"▋";animation:blink 1s infinite;margin-left:2px;color:var(--acc)}
@keyframes blink{50%{opacity:0}}

/* BOUTON FLOTTANT GÉANT */
#fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border:none;border-radius:30px;padding:16px 32px;font-size:16px;font-weight:800;box-shadow:0 10px 25px rgba(249,115,22,0.4);z-index:15;display:flex;align-items:center;gap:10px;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
</style>

<body>
<div id="bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.textContent="Moteur 3D non chargé.";return}
const $=s=>document.querySelector(s),TAU=Math.PI*2;

/* ============ EXPERTS ============ */
const R=["Direction","Veille","Labo"],RX=[-9.3,0,9.3];
const TS=["Analyse ","Donne la proba exacte","Indique le scénario noir"];
const ts=(t,x)=>({r:2,t,m:["Analyse "+x,"Proba exacte","Scénario noir"],g:"Honnête.",sys:`Tu es l'Analyste Expert pour ${x}. Tu maîtrises l'Overround, le CLV, les xG et la fatigue. Sois direct et professionnel.`});

const A=[
{r:0,t:"Directeur Exécutif",f:"Stratège / Chef d'Orchestre",m:["Reçoit tes demandes","Ordonne aux experts","Synthétise le verdict"],sys:"Tu es Abdarrahim, le Directeur Exécutif. Tu es le chef. Quand l'utilisateur te demande d'analyser un match, TU NE RÉPONDS PAS SEUL. Tu dois OBLIGATOIREMENT convoquer tes experts. Structure ta réponse ainsi :\n\n🏛️ **Directeur Abdarrahim** : Je convoque mon équipe pour ce match.\n🎯 **Testeur (Liga/LDC/L1)** : [Ordonne-lui de donner les stats xG et la forme]\n📊 **Data Scientist** : [Ordonne-lui de vérifier les blessures et l'impact]\n💰 **Expert Value** : [Ordonne-lui de calculer l'EV et la marge]\n⚖️ **VERDICT FINAL DU BUREAU** : [Ta décision claire : Parier ou Passer, et pourquoi].\n\nUtilise un ton autoritaire et professionnel."},
{r:0,t:"Expert Value (EV/CLV)",f:"Mathématicien / Trader",m:["Calcule l'EV","Traque le CLV","Kelly"],sys:"Tu es le Parieur Pro. Tu ne jures que par l'Expected Value et la marge (overround). Tu recommandes des mises via Kelly."},
{r:0,t:"Auditeur Promo",f:"Juriste",m:["Détecte les pièges","Calcule le rollover","Protège le capital"],sys:"Tu es l'Auditeur des conditions promo. Tu calcules les rollovers."},
{r:1,t:"Scout Terrain",f:"Journaliste",m:["Blessures","Impact tactique","Zéro rumeur"],sys:"Tu es le Scout. Tu ne valides que les infos officielles sur les blessures."},
{r:1,t:"Data Scientist",f:"Statisticien",m:["xG et xGA","Surperformance","Séries"],sys:"Tu es le Data Scientist. Tu ne regardes que les xG."},
{r:1,t:"Trader Marché (LDP)",f:"Flux / LDP",m:["Mouvements de cotes","LDP","Alertes"],sys:"Tu es le Trader. Tu surveilles les baisses de cotes."},
ts("Testeur Liga","la Liga"),ts("Testeur Ligue 1","la Ligue 1"),ts("Testeur Ligue des champions","la Ligue des champions"),
{r:2,t:"Modélisateur",f:"Mathématicien",m:["Poisson","Over/Under","Scores"],sys:"Tu es le Mathématicien. Tu utilises la Loi de Poisson."},
{r:2,t:"Scénariste (Risques)",f:"Pre-mortem",m:["Scénarios noirs","Résilience","Failles"],sys:"Tu es l'Analyste de risque. Cherche les failles du match."}
];

/* ============ STATE ============ */
let N=["Abdarrahim","Abdoulaye","Abakar","Oumar","Marwan","Abdel Latif","Mahmoud","Abba","Elyou","Karim","Sofiane"];
let REP=null;
const H={};
let API_KEY=localStorage.getItem("bn3_api_key")||"";
let API_MODEL=localStorage.getItem("bn3_api_model")||"google/gemini-2.0-flash-exp:free";

try{const s=JSON.parse(localStorage.getItem("bn3")||"null");if(Array.isArray(s)&&s.length===11)N=s;}catch(e){}
try{const r=JSON.parse(localStorage.getItem("bn3_infos")||"null");if(r&&typeof r==="object")REP=r;}catch(e){}
try{const c=JSON.parse(localStorage.getItem("bn3_chat")||"null");if(c&&typeof c==="object")Object.assign(H,c);}catch(e){}

const nm=i=>N[i]||"À nommer";
function saveNames(){try{localStorage.setItem("bn3",JSON.stringify(N));}catch(e){}}
function saveInfos(){try{localStorage.setItem("bn3_infos",JSON.stringify(REP));}catch(e){}}
function saveChat(){try{const t={};Object.keys(H).forEach(k=>{t[k]=H[k].slice(-15);});localStorage.setItem("bn3_chat",JSON.stringify(t));}catch(e){}}
function saveApi(){try{localStorage.setItem("bn3_api_key",API_KEY);localStorage.setItem("bn3_api_model",API_MODEL);}catch(e){}}

/* ---------- SCÈNE 3D ---------- */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;
document.body.prepend(ren.domElement);const cv=ren.domElement;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0f172a);sc.fog=new THREE.Fog(0x0f172a, 20, 70);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
sc.add(new THREE.AmbientLight(0xffffff, 0.6));sc.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);dirLight.position.set(10, 20, 10);dirLight.castShadow = true;sc.add(dirLight);
RX.forEach((x,i)=>{const spot = new THREE.PointLight([0xf97316, 0x3b82f6, 0x8b5cf6][i], 1.5, 20);spot.position.set(x, 5, 0);sc.add(spot)});

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.2},o||{}));
function bx(w,h,d,c,x,y,z,o,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}

// Sol
const fl=new THREE.Mesh(new THREE.PlaneGeometry(29,11), M(0x334155,{roughness:.4}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
sc.add(new THREE.GridHelper(29, 20, 0x475569, 0x1e293b)).position.y = 0.02;

// Murs
bx(29,5,.3,0x475569,0,2.5,-5.3);bx(.3,5,11,0x475569,-14.6,2.5,0);bx(.3,5,11,0x475569,14.6,2.5,0);

// Tapis
const RC=[0x7c2d12,0x1e3a8a,0x4c1d95];
RX.forEach((x,i)=>{const r=new THREE.Mesh(new THREE.PlaneGeometry(7,5),M(RC[i],{roughness:.9}));r.rotation.x=-Math.PI/2;r.position.set(x,.03,i==0?2.5:i==1?2.2:2.6);r.receiveShadow=true;sc.add(r)});

// Bureau
const scrs=[];
function desk(x,z){
  bx(2.2,.1,1.1,0x1e293b,x,.76,z);bx(.1,.72,.9,0x0f172a,x-1,.36,z);bx(.1,.72,.9,0x0f172a,x+1,.36,z);
  bx(.9,.55,.05,0x000000,x-.4,1.2,z-.24);const s1=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x1e3a8a}));s1.position.set(x-.4,1.2,z-.21);sc.add(s1);scrs.push(s1);
  bx(.9,.55,.05,0x000000,x+.4,1.2,z-.24);const s2=new THREE.Mesh(new THREE.PlaneGeometry(.82,.48),new THREE.MeshBasicMaterial({color:0x7c2d12}));s2.position.set(x+.4,1.2,z-.21);sc.add(s2);scrs.push(s2);
  bx(.6,.03,.2,0x000000,x,.82,z+.2);bx(.6,.1,.6,0x0f172a,x,.45,z+.9);bx(.6,.7,.1,0x0f172a,x,.8,z+1.2);
}
const D=[[-11.8,-2.6],[-9.3,-2.6],[-6.8,-2.6],[-2.5,-2.6],[0,-2.6],[2.5,-2.6],[6.8,-2.6],[9.3,-2.6],[11.8,-2.6],[8.05,.9],[10.55,.9]];
D.forEach(d=>desk(d[0],d[1]));

// Personnages
const SKN=[0xfcd34d,0xfbbf24,0x78350f,0x451a03,0x1c1917],SHI=[0x1e293b,0x0f172a,0x334155,0x111827];
function limb(w,h,d,c,x,y,p){const g=new THREE.Group();g.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=-h/2;m.castShadow=true;g.add(m);p.add(g);return g}
function person(i){
  const g=new THREE.Group(),sk=SKN[i%5],boss=i==0,sh=boss?0x000000:SHI[i%4];
  const L=limb(.2,.8,.22,0x1e293b,-.13,.8,g),Rr=limb(.2,.8,.22,0x1e293b,.13,.8,g);
  bx(.55,.65,.3,sh,0,1.12,0,null,g);const AL=limb(.15,.58,.15,sh,-.36,1.42,g),AR=limb(.15,.58,.15,sh,.36,1.42,g);
  bx(.14,.1,.14,sk,0,-.62,0,null,AL);bx(.14,.1,.14,sk,0,-.62,0,null,AR);bx(.12,.14,.12,sk,0,1.5,0,null,g);new THREE.Mesh(new THREE.SphereGeometry(.21,16,12),M(sk)).position.set(0,1.72,0);g.add(new THREE.Mesh(new THREE.SphereGeometry(.21,16,12),M(sk))).position.set(0,1.72,0);
  if(i<6) bx(.08,.35,.02,[0xef4444,0x3b82f6,0xfbbf24,0x22c55e][i%4],0,1.2,.16,null,g);
  g.traverse(o=>{o.userData.i=i});return{g,L,R:Rr,AL,AR};
}
const AG=A.map((a,i)=>{
  const p=person(i),d=D[i];
  p.g.position.set(d[0],-.33,d[1]+.85);p.g.rotation.y=Math.PI;sc.add(p.g);
  const k=document.createElement("canvas");k.width=256;k.height=64;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false,transparent:true}));sp.scale.set(2,.5,1);sp.position.y=2.3;sp.renderOrder=9;p.g.add(sp);
  Object.assign(p,{i,d,k,sp,st:"sit",t:6+Math.random()*10,q:[],ph:Math.random()*6,baseY:Math.PI});label(p);return p;
});
function label(p){const g=p.k.getContext("2d");g.clearRect(0,0,256,64);g.fillStyle="rgba(15,23,42,.9)";g.beginPath();g.roundRect(6,10,244,44,8);g.fill();g.strokeStyle="#f97316";g.lineWidth=2;g.stroke();g.fillStyle="#fff";g.font="bold 22px system-ui";g.textAlign="center";g.fillText(nm(p.i),128,40);p.sp.material.map.needsUpdate=true}
function sitPose(p){p.g.position.y=-.33;p.L.rotation.x=p.R.rotation.x=-1.45}
AG.forEach(p=>{sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1});

// Caméra Loop
let th=0,ph=.85,di=45,ddi=45,tg=new THREE.Vector3(0,1.5,0),ttg=tg.clone();
const portrait=()=>innerWidth<innerHeight,ALL=()=>portrait()?65:35;
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener("resize",()=>{resize();if(fol<0)ddi=ALL()});resize();ddi=di=ALL();
let fol=-1;
const clk=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clk.getDelta()),T=clk.elapsedTime;
  AG.forEach(p=>{
    if(p.st=="sit"){p.AL.rotation.x=-1+Math.sin(T*9+p.ph)*.1;p.AR.rotation.x=-1+Math.cos(T*8+p.ph)*.1}
  });
  tg.lerp(ttg,.08);di+=(ddi-di)*.08;
  cam.position.set(tg.x+di*Math.sin(ph)*Math.sin(th),tg.y+di*Math.cos(ph),tg.z+di*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);
  scrs.forEach((s,k)=>s.material.color.setHex((Math.sin(T*3+k)>.9)?0xffffff:0x1e3a8a));
  ren.render(sc,cam);
}
loop();

/* ============ INTERFACE ============ */
const sh=$("#sh");
function div(c,t,p){const e=document.createElement("div");if(c)e.className=c;if(t!==undefined)e.textContent=t;(p||sh).append(e);return e}
function close(){sh.className="";fol=-1}

function formatText(txt){
  if(!txt) return "";
  let html = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  html = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const lines = html.split("\n");let inList=false, result=[];
  for(let line of lines){
    const bullet = line.match(/^[\s]*[-•*]\s+(.*)$/);
    if(bullet){ if(!inList){ result.push("<ul>"); inList=true; } result.push("<li>"+bullet[1]+"</li>"); }
    else { if(inList){ result.push("</ul>"); inList=false; } result.push(line); }
  }
  if(inList) result.push("</ul>");
  return result.join("\n").replace(/\n/g, "<br>");
}

function open(i){
  sh.className="on";sh.textContent="";H[i]=H[i]||[];
  const top=div("hd");
  if(i>=0){ fol=i;ddi=12; }
  else { fol=-1;th=0;ph=.85;ddi=ALL(); }
  
  let title = i==-1?"🏛️ Bureau du Directeur":i==-2?"⚙️ Configuration API":"";
  if(i>=0){ title = "Fiche : "+nm(i); }
  const t=div("",title,top);t.style.cssText="font-weight:800;font-size:18px;flex:1;color:var(--acc)";
  
  const x=document.createElement("button");x.className="x";x.textContent="✕";x.onclick=close;top.append(x);
  
  if(i==-2){ renderApiConfig(); return; }

  // Zone de log
  const logContainer=div("",undefined);logContainer.id="log-container";
  
  // Message d'accueil si vide
  if(!H[i] || H[i].length===0){
    if(i<0){
      const welcome = "Bonjour, je suis **Abdarrahim**, le Directeur Exécutif.\n\nDonnez-moi un match (ex: *Real Madrid - Barcelone en Liga* ou *PSG - Bayern en Ligue des Champions*). Je vais immédiatement convoquer mes experts (Data Scientist, Trader, etc.) pour analyser le match et vous donner un verdict clair.\n\n⚠️ **Note** : Assurez-vous d'avoir configuré votre clé API dans ⚙️ pour que je puisse travailler.";
      const msgDiv = div("m ai","",logContainer); msgDiv.innerHTML=formatText(welcome);
    }
  }

  H[i].forEach(m=>{ const msgDiv = div("m "+m[0],"",logContainer); msgDiv.innerHTML=formatText(m[1]); });
  
  // Zone de saisie
  const row=div("row");
  const ta=document.createElement("textarea");ta.rows=1;
  ta.placeholder="Demandez un match (ex: Real - Barça)...";
  const b=document.createElement("button");b.className="go";b.textContent="Envoyer";
  b.onclick=()=>ask(i,ta,logContainer,b);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();b.click()}});
  row.append(ta,b);
  
  // Bouton Config API rapide
  const apiBtn=document.createElement("button");
  apiBtn.style.cssText="margin-top:10px;font-size:12px;color:var(--mut);text-decoration:underline;background:none;border:none;width:100%;text-align:center;flex:none";
  apiBtn.textContent="⚙️ Configurer la clé API (OpenRouter)";
  apiBtn.onclick=()=>open(-2);
  sh.append(apiBtn);
  
  setTimeout(()=>{ logContainer.scrollTop = logContainer.scrollHeight; ta.focus(); },100);
}

function renderApiConfig(){
  div("k","Clé API OpenRouter (Gratuite)");
  const help=div("sys","1. Allez sur openrouter.ai → Keys\n2. Créez une clé\n3. Collez-la ici");
  const keyInp=document.createElement("input");keyInp.type="password";keyInp.value=API_KEY;keyInp.placeholder="sk-or-v1-...";
  sh.append(keyInp);
  div("k","Modèle");
  const sel=document.createElement("select");
  [
    ["google/gemini-2.0-flash-exp:free","Gemini 2.0 Flash (Rapide)"],
    ["meta-llama/llama-3.3-70b-instruct:free","Llama 3.3 70B (Intelligent)"],
    ["mistralai/mistral-small-3.2-24b-instruct:free","Mistral Small"]
  ].forEach(o=>{const op=document.createElement("option");op.value=o[0];op.textContent=o[1];if(API_MODEL===o[0])op.selected=true;sel.append(op)});
  sh.append(sel);
  const status = div("", API_KEY ? "✅ Clé enregistrée" : "⚠️ Aucune clé configurée");status.className = API_KEY ? "status-ok" : "status-err";sh.append(status);
  const btn=document.createElement("button");btn.className="go";btn.textContent="Sauvegarder";btn.style.cssText="margin-top:15px;width:100%;height:48px";
  btn.onclick=()=>{ API_KEY=keyInp.value.trim();API_MODEL=sel.value;saveApi();status.textContent=API_KEY?"✅ Clé enregistrée":"⚠️ Aucune clé";status.className=API_KEY?"status-ok":"status-err";setTimeout(()=>close(),800); };
  sh.append(btn);
}

/* ============ APPEL API : ORCHESTRATION DU DIRECTEUR ============ */
async function ask(i,ta,log,btn){
  const q=ta.value.trim();if(!q)return;
  if(!API_KEY){ close(); setTimeout(()=>{open(-2); alert("Veuillez d'abord configurer votre clé API pour que le Directeur puisse travailler.");}, 300); return; }

  ta.value="";
  const meDiv = div("m me","",log); meDiv.innerHTML=formatText(q);
  const w=div("m ai typing","",log);
  w.textContent="🤖 Le Directeur convoque son équipe...";
  H[i]=H[i]||[];
  H[i].push(["me",q]);
  btn.disabled=true;
  log.scrollTop = log.scrollHeight;

  // Injection du contexte si le formulaire a été rempli
  let context = "";
  if(REP && REP.match) {
    context = `\n\n[INFO TERRAIN] Match: ${REP.match} | Cotes: ${REP.c1}-${REP.cx}-${REP.c2} | Note: ${REP.note}`;
  }

  let sysPrompt = "";
  if(i < 0) {
    // PROMPT DU DIRECTEUR (Orchestrateur)
    sysPrompt = `Tu es Abdarrahim, le Directeur Exécutif du bureau d'analyse football. 
Tu parles avec autorité. L'utilisateur vient de te demander d'analyser un match (Liga, Ligue 1, ou Ligue des Champions).
Tu ne réponds JAMAIS tout seul. Tu dois convoquer ton équipe et simuler leur intervention.

Structure EXACTE de ta réponse :
🏛️ **Directeur Abdarrahim** : "Je prends la direction de cette analyse. J'ordonne à mon équipe de se mettre au travail."
🎯 **Testeur (Liga/PL/L1)** : "[Donne un ordre au testeur, puis écris sa réponse avec les stats xG et la forme]"
📊 **Data Scientist** : "[Donne un ordre au data scientist, puis écris sa réponse sur les blessures]"
💰 **Expert Value** : "[Donne un ordre au parieur, puis écris sa réponse sur l'EV et la marge]"
⚖️ **VERDICT FINAL DU BUREAU** : "[Ta conclusion finale, claire et nette : PARIER ou PASSER, et pourquoi]"

Rappel : Sois professionnel, utilise du gras, et donne l'impression d'un vrai travail d'équipe coordonné par un chef.` + context;
  } else {
    sysPrompt = A[i].sys + context;
  }

  const messages = [{ role: "system", content: sysPrompt }];
  H[i].slice(-4, -1).forEach(m => { messages.push({ role: m[0] === "me" ? "user" : "assistant", content: m[1] }); });
  messages.push({ role: "user", content: q });

  const models = [API_MODEL, "meta-llama/llama-3.3-70b-instruct:free", "google/gemini-2.0-flash-exp:free"];
  let success = false;
  let lastError = "";

  for(let m of models){
    if(success) break;
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json", "HTTP-Referer": location.origin, "X-Title": "Desk Trading" },
        body: JSON.stringify({ model: m, messages: messages, temperature: 0.6, stream: true })
      });

      if (!res.ok) {
        if(res.status === 429) { lastError = "Modèle saturé (429). Bascule..."; continue; }
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error?.message || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = ""; let buffer = "";
      w.classList.add("typing"); w.textContent = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content || "";
            if (content) { full += content; w.innerHTML = formatText(full); log.scrollTop = log.scrollHeight; }
          } catch (e) {}
        }
      }
      
      w.classList.remove("typing");
      if (!full.trim()) throw new Error("Réponse vide");
      w.innerHTML = formatText(full);
      H[i].push(["ai", full]);
      saveChat();
      success = true;
      break;
    } catch(e) {
      lastError = e.message;
      w.textContent = `⚠️ Erreur. Bascule...`;
    }
  }

  if(!success) {
    w.classList.remove("typing");
    w.innerHTML = "⚠️ <b>Échec de connexion.</b> Vérifiez votre clé API.";
    w.style.color = "#ef4444";
  }
  btn.disabled = false;
  log.scrollTop = log.scrollHeight;
}
})();
