<!DOCTYPE html>

<style>

button{font:inherit;color:inherit;cursor:pointer}
#bar button{flex:none;background:#1b222cdd;border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
#bar button.h{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:#fffc;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:52vh;overflow:auto;background:var(--card);border-top:3px solid var(--acc);border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;max-width:760px;margin-inline:auto;z-index:20}
@media (orientation:landscape) and (max-height:560px){#sh{max-height:82vh}}
#sh.on{display:block}
.hd{display:flex;gap:10px;align-items:center}
.hd input{font:inherit;font-weight:700;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mut)}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 2px}
#sh ul{margin:0;padding-left:18px}
.m{padding:7px 10px;border-radius:10px;max-width:92%;white-space:pre-wrap;margin-top:6px;font-size:13.5px;line-height:1.5}
.me{margin-left:auto;background:var(--acc);color:#111}
.ai{background:var(--bg);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:8px}
textarea{flex:1;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:none;width:100%}
input[type=text]{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
.go{background:var(--acc);color:#111;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hint">Glisse pour tourner · pince pour zoomer · touche un employé pour le suivre</div>
<aside id="sh"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.textContent="Le moteur 3D n’a pas pu se charger.";return}
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const R=["Direction et contrôle","Veille Web (sources publiques)","Laboratoire de tests"],RX=[-9.3,0,9.3];
const TS=["Teste les matchs à venir de ","Donne le résultat le plus probable avec un pourcentage estimé","Indique le scénario qui ferait échouer le pronostic"];

const A=[

{r:0,t:"Parieur",f:"Comparaison cote / probabilité",m:["Transforme les analyses en choix de marché","Compare la cote affichée à la probabilité estimée","Tient le bilan réel : 0 pari enregistré"],g:"Chercher un avantage positif sur la durée, mesuré sur les résultats réels."},
{r:0,t:"Contrôleur du code promo",f:"Lecture des conditions du code",m:["Lit les conditions (mise minimale, délais, marchés exclus)","Signale les pièges avant utilisation","Rappelle qu’un bonus ne justifie jamais un pari"],g:"Que le code serve la personne, jamais l’inverse."},
{r:1,t:"Traqueur : blessures et compositions",f:"Sites des clubs, ligues, UEFA, médias reconnus",m:["Relève blessés, suspendus, compositions probables","Vérifie chaque info sur deux sources","Date et source pour chaque information"],g:"Rien d’inventé, rien de non vérifié."},
{r:1,t:"Traqueur : forme et statistiques",f:"Sites statistiques spécialisés",m:["Cinq derniers matchs, domicile / extérieur, xG","Classements, enjeu, fatigue, calendrier","Signale les données manquantes"],g:"Des chiffres fiables et datés."},
{r:1,t:"Traqueur : cotes et marchés",f:"Site Pariez Cash, actualités publiques",m:["Relève les cotes et l’heure de vérification","Suit les mouvements de cotes","Écarte les rumeurs anonymes et les « tuyaux »"],g:"Des cotes réelles, jamais devinées."},
ts("Testeur Liga","la Liga"),ts("Testeur Premier League","la Premier League"),ts("Testeur Ligue des champions","la Ligue des champions"),
{r:2,t:"Testeur modèle de buts",f:"Modèle de Poisson, totaux de buts",m:["Estime les buts attendus de chaque équipe","Calcule scores probables et plus/moins 2,5 buts","Précise quand les données sont insuffisantes"],g:"Des chiffres prudents, jamais gonflés."},
{r:2,t:"Testeur scénarios",f:"Scénarios favorable, neutre, défavorable",m:["Rejoue chaque match dans trois scénarios","Mesure l’effet d’une absence ou de la fatigue","Dit quand le pronostic ne tient plus"],g:"Voir les failles avant le match."}];

/* ============ STATE + PERSISTANCE ============ */
let N=["Abdarrahim","Abdoulaye","Abakar","Oumar","Marwan","Abdel Latif","Mahmoud","Abba","Elyou","",""];
let REP=null;
const H={};
try{const s=JSON.parse(localStorage.getItem("bn3")||"null");if(Array.isArray(s)&&s.length===11)N=s;}catch(e){}
try{const r=JSON.parse(localStorage.getItem("bn3_infos")||"null");if(r&&typeof r==="object")REP=r;}catch(e){}
try{const c=JSON.parse(localStorage.getItem("bn3_chat")||"null");if(c&&typeof c==="object")Object.assign(H,c);}catch(e){}
const nm=i=>N[i]||"À nommer";
function saveNames(){try{localStorage.setItem("bn3",JSON.stringify(N));}catch(e){}}
function saveInfos(){try{localStorage.setItem("bn3_infos",JSON.stringify(REP));}catch(e){}}
function saveChat(){try{const t={};Object.keys(H).forEach(k=>{t[k]=H[k].slice(-20);});localStorage.setItem("bn3_chat",JSON.stringify(t));}catch(e){}}

/* ---------- scène ---------- */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);const cv=ren.domElement;
const sc=new THREE.Scene(),SKY=0xa9cbe8;sc.background=new THREE.Color(SKY);sc.fog=new THREE.Fog(SKY,50,110);
const cam=new THREE.PerspectiveCamera(48,1,.1,200);
sc.add(new THREE.HemisphereLight(0xffffff,0x8a7a68,.8));
const sun=new THREE.DirectionalLight(0xfff0d8,.9);sun.position.set(8,20,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-22,right:22,top:14,bottom:-14,near:1,far:60});sc.add(sun);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.05},o||{}));
function bx(w,h,d,c,x,y,z,o,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}
function cyl(r,h,c,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;sc.add(m);return m}
function ball(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c));m.position.set(x,y,z);m.castShadow=true;(p||sc).add(m);return m}
function wood(){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");for(let i=0;i<16;i++){g.fillStyle=`hsl(28,${35+Math.random()*10}%,${40+Math.random()*12}%)`;g.fillRect(0,i*32,512,31)}for(let i=0;i<500;i++){g.fillStyle="rgba(60,30,10,.09)";g.fillRect(Math.random()*512,Math.random()*512,40+Math.random()*70,1)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(7,3);t.anisotropy=4;return t}
const fl=new THREE.Mesh(new THREE.PlaneGeometry(29,11),M(0xffffff,{map:wood(),roughness:.55}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x6f8f6a));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;sc.add(ground);
const RC=[0xc2410c,0x0e7490,0x7c3aed];
RX.forEach((x,i)=>{const r=new THREE.Mesh(new THREE.PlaneGeometry(6.5,4.2),M(RC[i],{roughness:.95}));r.rotation.x=-Math.PI/2;r.position.set(x,.01,i==0?2.5:i==1?2.2:2.6);r.receiveShadow=true;sc.add(r)});
bx(29,4.6,.3,0xe9e1d1,0,2.3,-5.3);bx(.3,4.6,10.8,0xe9e1d1,-14.6,2.3,0);bx(.3,4.6,10.8,0xe9e1d1,14.6,2.3,0);bx(29,.15,.35,0x4b3a2a,0,.07,-5.2);
[-4.6,4.6].forEach(x=>{bx(.08,3.2,10.5,0x9fd0ff,x,1.6,0,{transparent:true,opacity:.2,roughness:.1});bx(.12,3.4,.12,0x333b47,x,1.7,-5);bx(.12,3.4,.12,0x333b47,x,1.7,5)});
[0,9.3].forEach(c=>[-2.6,2.6].forEach(o=>{bx(2.8,2.1,.1,0xf5f5f5,c+o,2.5,-5.1);const w=new THREE.Mesh(new THREE.PlaneGeometry(2.5,1.8),new THREE.MeshBasicMaterial({color:0xcfe8ff}));w.position.set(c+o,2.5,-5.03);sc.add(w)}));
function plate(t,x,c){const k=document.createElement("canvas");k.width=512;k.height=96;const g=k.getContext("2d");g.fillStyle="#1b222c";g.fillRect(0,0,512,96);g.fillStyle=c;g.fillRect(0,86,512,10);g.fillStyle="#fff";g.font="bold 34px system-ui";g.textAlign="center";g.fillText(t,256,58);const m=new THREE.Mesh(new THREE.PlaneGeometry(4.6,.86),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(k)}));m.position.set(x,4.0,-5.1);sc.add(m)}
plate(R[0],RX[0],"#c2410c");plate("Veille Web",RX[1],"#0e7490");plate(R[2],RX[2],"#7c3aed");

/* écran INFOS DU JOUR */
const sk=document.createElement("canvas");sk.width=1024;sk.height=420;const sg=sk.getContext("2d"),stex=new THREE.CanvasTexture(sk);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(6.6,2.7),new THREE.MeshBasicMaterial({map:stex}));scr.position.set(RX[0],2.4,-5.12);sc.add(scr);bx(6.8,2.9,.08,0x111111,RX[0],2.4,-5.18);
function drawScr(){
  sg.fillStyle="#0b1626";sg.fillRect(0,0,1024,420);
  sg.fillStyle="#fb923c";sg.font="bold 44px system-ui";sg.fillText("INFOS DU JOUR",36,60);
  sg.fillStyle="#9fb3c8";sg.font="26px system-ui";
  sg.fillText(REP&&REP.date?REP.date+" · heure du Tchad":"En attente du rapport…",36,98);
  sg.fillStyle="#fff";sg.font="28px system-ui";
  const lines=(REP&&REP.lines&&REP.lines.length)?REP.lines:["Ouvre « 📋 INFOS DU JOUR »","pour saisir le programme du jour."];
  lines.slice(0,7).forEach((l,i)=>sg.fillText(String(l).slice(0,58),36,150+i*38));
  stex.needsUpdate=true;
}
drawScr();

/* mobilier */
const scrs=[];
function desk(x,z){bx(1.8,.08,.9,0x8b5e3c,x,.76,z);bx(.06,.72,.8,0x6b4a30,x-.82,.38,z);bx(.06,.72,.8,0x6b4a30,x+.82,.38,z);bx(.1,.2,.1,0x222222,x,.9,z-.22);bx(.82,.5,.05,0x0d0d0d,x,1.2,z-.24);const s=new THREE.Mesh(new THREE.PlaneGeometry(.74,.42),new THREE.MeshBasicMaterial({color:0x5cc8ff}));s.position.set(x,1.2,z-.21);sc.add(s);scrs.push(s);bx(.5,.03,.18,0x222222,x,.82,z+.12);
bx(.55,.07,.55,0x2b2f38,x,.45,z+.9);bx(.55,.6,.07,0x2b2f38,x,.82,z+1.17);bx(.08,.4,.08,0x555,x,.22,z+.9)}
function plant(x,z){cyl(.28,.5,0x9a5b3a,x,.25,z);ball(.4,0x2f7d3b,x,.85,z);ball(.3,0x3a9448,x+.12,1.15,z)}
function board(x,z){bx(2.6,1.5,.06,0xffffff,x,1.5,z);bx(.06,1.4,.06,0x555,x-1.1,.7,z+.05);bx(.06,1.4,.06,0x555,x+1.1,.7,z+.05);bx(2.0,.04,.01,0x2563eb,x,1.7,z+.04);bx(1.5,.04,.01,0xdc2626,x,1.4,z+.04)}
function coffee(x,z){bx(.9,.9,.6,0x333b47,x,.45,z);bx(.5,.5,.4,0x1d4ed8,x,1.15,z)}
const D=[[-11.8,-2.6],[-9.3,-2.6],[-6.8,-2.6],[-2.5,-2.6],[0,-2.6],[2.5,-2.6],[6.8,-2.6],[9.3,-2.6],[11.8,-2.6],[8.05,.9],[10.55,.9]];
D.forEach(d=>desk(d[0],d[1]));
cyl(1.25,.08,0xcbb48a,RX[0],.76,2.7);cyl(.12,.7,0x444444,RX[0],.38,2.7);
plant(-13.6,-4.2);plant(-4.9,3.9);plant(4.9,-4.2);plant(13.6,3.9);board(-3.4,-4.6);board(13.2,-4.6);coffee(3.6,-4.5);
const SP=[[[-11,2.7],[-7.6,2.7],[-9.3,4.1]],[[-3.4,-3.6],[3.4,-3.6],[0,2.5]],[[13.2,-3.6],[6,3.5],[11,3.4]]];

/* personnages */
const SKN=[0x3b2416,0x5a3825,0x7a4a2e,0x9b6a45,0xc58f66],SHI=[0x2f6f8f,0xb4533a,0x4a7c59,0x8a6fb0,0xcfa13a,0x5b6b7a,0x3d5a98,0xa3405a];
function limb(w,h,d,c,x,y,p){const g=new THREE.Group();g.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=-h/2;m.castShadow=true;g.add(m);p.add(g);return g}
function person(i){
  const g=new THREE.Group(),sk=SKN[(i*2+1)%5],boss=i==0,sh=boss?0x1c2742:SHI[i%8];
  const L=limb(.18,.8,.2,boss?0x15151d:0x2c3445,-.12,.8,g),Rr=limb(.18,.8,.2,boss?0x15151d:0x2c3445,.12,.8,g);
  bx(.5,.62,.28,sh,0,1.11,0,null,g);const AL=limb(.14,.56,.14,sh,-.33,1.4,g),AR=limb(.14,.56,.14,sh,.33,1.4,g);
  bx(.13,.1,.13,sk,0,-.6,0,null,AL);bx(.13,.1,.13,sk,0,-.6,0,null,AR);
  bx(.1,.12,.1,sk,0,1.46,0,null,g);ball(.19,sk,0,1.66,0,g);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.205,16,10,0,TAU,0,Math.PI*.55),M(0x121212));h.position.set(0,1.69,-.01);g.add(h);
  ball(.025,0x111111,-.07,1.68,.18,g);ball(.025,0x111111,.07,1.68,.18,g);
  if(boss||i%3==1)bx(.2,.1,.06,0x181818,0,1.44,.15,null,g);
  if(boss)bx(.07,.3,.03,0xb91c1c,0,1.15,.15,null,g);
  g.traverse(o=>{o.userData.i=i});return{g,L,R:Rr,AL,AR};
}
const AG=A.map((a,i)=>{
  const p=person(i),d=D[i];
  p.g.position.set(d[0],-.33,d[1]+.85);p.g.rotation.y=Math.PI;sc.add(p.g);
  const k=document.createElement("canvas");k.width=256;k.height=64;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false,transparent:true}));
  sp.scale.set(1.7,.42,1);sp.position.y=2.15;sp.renderOrder=9;p.g.add(sp);
  Object.assign(p,{i,d,k,sp,st:"sit",t:6+Math.random()*10,q:[],ph:Math.random()*6,baseY:Math.PI});
  label(p);return p;
});
function label(p){const g=p.k.getContext("2d");g.clearRect(0,0,256,64);g.fillStyle="rgba(15,20,28,.8)";g.fillRect(6,10,244,44);g.fillStyle="#fff";g.font="bold 26px system-ui";g.textAlign="center";g.fillText(nm(p.i),128,42);p.sp.material.map.needsUpdate=true}
function sitPose(p){p.g.position.y=-.33;p.L.rotation.x=p.R.rotation.x=-1.45}
function standPose(p){p.g.position.y=0;p.L.rotation.x=p.R.rotation.x=0;p.AL.rotation.x=p.AR.rotation.x=0}
AG.forEach(p=>{sitPose(p);p.AL.rotation.x=p.AR.rotation.x=-1});
function go(p,x,z){p.q.push([x,z])}
function tick(p,dt,T){
  const g=p.g;
  if(p.st=="sit"){
    p.AL.rotation.x=-1+Math.sin(T*9+p.ph)*.1;
    p.AR.rotation.x=-1+Math.cos(T*8+p.ph)*.1;
    p.t-=dt;
    if(p.t<0){
      standPose(p);
      const s=SP[A[p.i].r];
      const w=s[Math.floor(Math.random()*s.length)];
      go(p,p.d[0],p.d[1]+1.7);go(p,w[0]+(Math.random()-.5)*.6,w[1]);
      p.st="walk";p.next="idle";
    }
    return;
  }
  if(p.st=="idle"){
    p.t-=dt;
    g.rotation.y=p.baseY+Math.sin(T*.8+p.ph)*.25;
    p.AL.rotation.x=Math.sin(T*2+p.ph)*.12;
    p.AR.rotation.x=-.5+Math.sin(T*3)*.2;
    if(p.t<0){
      p.AR.rotation.x=0;
      go(p,p.d[0],p.d[1]+1.7);go(p,p.d[0],p.d[1]+.85);
      p.st="walk";p.next="sit";
    }
    return;
  }
  const q=p.q[0];
  if(!q){
    if(p.next=="sit"){
      g.rotation.y=Math.PI;sitPose(p);
      p.AL.rotation.x=p.AR.rotation.x=-1;
      p.st="sit";p.t=8+Math.random()*14;
    }else{
      p.baseY=g.rotation.y;
      p.st="idle";p.t=3+Math.random()*4;
    }
    p.L.rotation.x=p.R.rotation.x=0;
    return;
  }
  const dx=q[0]-g.position.x,dz=q[1]-g.position.z,d=Math.hypot(dx,dz);
  if(d<.08){p.q.shift();return;}
  const a=Math.atan2(dx,dz);let df=a-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));
  g.rotation.y+=df*Math.min(1,dt*9);
  const sp=Math.min(d,1.35*dt);
  g.position.x+=dx/d*sp;g.position.z+=dz/d*sp;
  p.ph+=dt*9;const s=Math.sin(p.ph)*.7;
  p.L.rotation.x=s;p.R.rotation.x=-s;p.AL.rotation.x=-s*.7;p.AR.rotation.x=s*.7;
}

/* caméra */
let th=0,ph=.95,di=40,ddi=40,tg=new THREE.Vector3(0,1,0),ttg=tg.clone(),fol=-1;
const portrait=()=>innerWidth<innerHeight,ALL=()=>portrait()?62:32,ROOM=()=>portrait()?22:17;
function view(k){
  fol=-1;th=0;ph=.95;
  if(k<0){ttg.set(0,1,0);ddi=ALL();}
  else{ttg.set(RX[k],1,0);ddi=ROOM();}
}
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",()=>{resize();if(fol<0)ddi=ALL()});resize();ddi=di=ALL();
const P=new Map();let dn=null,pd=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);dn=[e.clientX,e.clientY,Date.now()];pd=0});
cv.addEventListener("pointermove",e=>{const o=P.get(e.pointerId);if(!o)return;if(P.size==1){th-=(e.clientX-o[0])*.006;ph=Math.max(.2,Math.min(1.45,ph-(e.clientY-o[1])*.005))}P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)ddi=Math.max(5,Math.min(80,ddi*pd/d));pd=d}});
cv.addEventListener("pointerup",e=>{P.delete(e.pointerId);pd=0;if(dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<7&&Date.now()-dn[2]<450)pick(e);dn=null});
cv.addEventListener("pointercancel",e=>{P.delete(e.pointerId);pd=0});
cv.addEventListener("wheel",e=>{ddi=Math.max(5,Math.min(80,ddi*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
const rc=new THREE.Raycaster();
function pick(e){
  rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
  const hits=rc.intersectObjects(AG.map(p=>p.g),true);
  const hit=hits.find(h=>h.object.userData.i!==undefined);
  if(hit)open(hit.object.userData.i);
}
const clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clk.getDelta()),T=clk.elapsedTime;
  AG.forEach(p=>tick(p,dt,T));
  if(fol>=0){const g=AG[fol].g;ttg.set(g.position.x,1.2,g.position.z)}
  tg.lerp(ttg,.07);di+=(ddi-di)*.07;
  cam.position.set(tg.x+di*Math.sin(ph)*Math.sin(th),tg.y+di*Math.cos(ph),tg.z+di*Math.sin(ph)*Math.cos(th));
  cam.lookAt(tg);
  scrs.forEach((s,k)=>s.material.color.setHex((Math.sin(T*1.3+k)>.97)?0xffffff:0x5cc8ff));
  ren.render(sc,cam);
})();

function open(i){

  if(i<0){fol=-1;th=0;ph=.95;ddi=ALL();}

  }
  if(i==-2){renderEditor();return;}
  div("k","Discussion");
  const log=div("");H[i].forEach(m=>div("m "+m[0],m[1],log));
  const row=div("row");const ta=document.createElement("textarea");ta.rows=2;ta.placeholder="Ta question…";
  const b=document.createElement("button");b.className="go";b.textContent="Envoyer";
  b.onclick=()=>ask(i,ta,log);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();b.click();}});
  row.append(ta,b);
}
function renderEditor(){
  const dateInp=document.createElement("input");

/* ============ MOTEUR DE CHAT LOCAL ============ */
const DISCLAIMER="⚠️ Un pronostic est une probabilité estimée, jamais une certitude. Aucun pari n'est « sûr ».";
const NO_DATA="Sans données vérifiées dans « 📋 INFOS DU JOUR », je ne peux pas te répondre précisément. C'est la règle du bureau : rien d'inventé.";
const PER={
  0:{pred:"Je rends un pronostic seulement si trois maillons sont solides : données vérifiées, modèle probabiliste, comparaison cote/proba. Tant qu'un maillon manque, je refuse de valider.",meth:"Ma méthode : croiser trois sources, dater chaque info, refuser les fragiles. Une info non recoupée ne sert à rien. Une info périmée est pire qu'une absence d'info.",team:"Mon équipe : trois traqueurs (blessures, forme, cotes), quatre testeurs, un parieur, un contrôleur. Chacun livre un avis daté, je synthétise.",code:"Le contrôleur lit les conditions, le parieur tient le bilan. Un code promo ne doit jamais pousser à parier plus.",fallback:"Pose ta question sur un match, un pronostic, un code promo, ou demande-moi comment fonctionne l'équipe."},
  1:{pred:"Mon critère : probabilité estimée × cote > 1. Si la cote dépasse ce que ma proba implique, c'est un avantage. Sinon, je passe sans regret.",data:"Sans cotes à jour et sans données vérifiées, je ne peux rien comparer. Ajoute les cotes dans « INFOS DU JOUR ».",meth:"Value betting basique : ne miser que si la cote est plus haute que ce que la proba réelle implique.",bilan:"Bilan actuel : 0 pari enregistré. Sans données vérifiées, pas de mise.",fallback:"Demande-moi de comparer une cote à une probabilité."},
  2:{code:"Avant d'utiliser un code, vérifie : mise minimale, marchés exclus, délais de retrait, conditions de rollover.",meth:"Un code n'est intéressant que si la mise demandée est atteignable dans un délai raisonnable.",pred:"Un code promo ne rend pas un mauvais pari bon. C'est un outil, pas une stratégie.",fallback:"Envoie-moi les conditions d'un code, je te dirai ce qu'il vaut."},
  3:{data:"Je relève blessés, suspendus et compositions probables. Chaque info doit venir de deux sources indépendantes.",meth:"Sites officiels, ligues, UEFA, médias reconnus. Je date tout.",pred:"Je ne fais pas de pronostic, je fournis la matière.",fallback:"Demande-moi des infos blessures/compos pour un club."},
  4:{data:"Je regarde les cinq derniers matchs, à domicile et à l'extérieur, plus les xG.",meth:"Forme = tendance pondérée. Attention aux séries gonflées.",pred:"La forme ne prédit pas seule.",fallback:"Demande-moi la forme récente d'une équipe."},
  5:{data:"Je relève les cotes et l'heure de vérification. Je n'écoute pas les rumeurs anonymes.",meth:"Une cote qui bouge fortement sans info publique = suspect.",pred:"Les cotes disent ce que le marché pense. Pas la vérité.",fallback:"Demande-moi une cote ou un mouvement de cote."},
  6:{pred:"Pour la Liga, j'estime un résultat probable. Sans données à jour, impossible.",meth:"Score probable + probabilité. Si l'écart-type est trop large, je renonce.",data:"La Liga est technique mais physique en défense.",fallback:"Demande-moi un match de Liga à tester."},
  7:{pred:"La Premier League est dense : repos entre matchs compte autant que forme.",meth:"Même méthode, avec pondération plus forte sur la fatigue.",data:"Les petites équipes anglaises sont plus solides à domicile.",fallback:"Demande-moi un match de Premier League."},
  8:{pred:"En Ligue des champions, l'écart entre phases est énorme. Aller ≠ retour.",meth:"Je traite aller et retour différemment. Un 1-0 à l'aller change tout.",data:"L'expérience européenne compte.",fallback:"Demande-moi un match de Ligue des champions."},
  9:{pred:"Modèle de Poisson : je calcule les buts attendus, puis la distribution. Sans forces à jour, impossible.",meth:"Poisson suppose l'indépendance des buts. Approximation, pas vérité.",data:"Les xG sont plus fiables que les buts marqués.",fallback:"Demande-moi une probabilité de score."},
  10:{pred:"Je rejoue le match en trois scénarios : favorable, neutre, défavorable.",meth:"Le but n'est pas de prédire, mais de comprendre pourquoi ça peut rater.",data:"Un scénario défavorable est un test de robustesse.",fallback:"Demande-moi de tester un pronostic en trois scénarios."}
};
function detect(q){
  const l=q.toLowerCase();
  return{
    pred:/pronostic|prédiction|pari|résultat|probable|chance|gagner|mise|parier/.test(l),
    data:/cote|classement|bless|xg|stat|forme|composition|effectif|donnée|info/.test(l),
    code:/code|promo|bonus/.test(l),
    meth:/comment|pourquoi|méthode|calcul|modèle|fonctionne|explique/.test(l),
    team:/équipe|tout le monde|ensemble|résume|qui fait quoi/.test(l),
    bilan:/bilan|gains|pertes|historique/.test(l)
  };
}
function localReply(idx,q){
  const d=detect(q);
  if(idx<0){
    return "🏛️ Directeur : "+PER[0].pred+"\n\n💰 Parieur : "+PER[1].pred+"\n\n🎯 Testeur : "+PER[9].pred+"\n\n"+DISCLAIMER+"\n\n"+NO_DATA;
  }
  const p=PER[idx]||{};
  if(d.team&&p.team)return p.team;
  if(d.code&&p.code)return p.code;
  if(d.meth&&p.meth)return p.meth;
  if(d.bilan&&p.bilan)return p.bilan;
  if(d.pred&&p.pred)return p.pred+"\n\n"+DISCLAIMER;
  if(d.data&&p.data)return p.data+"\n\n"+NO_DATA;
  return (p.fallback||"Pose ta question sur un match, un pronostic, un code promo.")+"\n\n"+NO_DATA;
}
function ask(i,ta,log){
  const q=ta.value.trim();if(!q)return;
  ta.value="";
  div("m me",q,log);
  const w=div("m ai","…",log);
  H[i]=H[i]||[];
  H[i].push(["me",q]);
  setTimeout(()=>{
    const reply=localReply(i,q);
    w.textContent=reply;
    H[i].push(["ai",reply]);
    saveChat();
  },350+Math.random()*350);
}
