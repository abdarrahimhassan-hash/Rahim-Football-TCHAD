<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Bureau d'analyse football 3D</title>
<meta name="description" content="Bureau 3D interactif : 11 employés en 3 salles pour analyser les matchs. Données vérifiées, pronostics honnêtes, zéro invention.">
<meta name="theme-color" content="#0a0e14">
<meta property="og:title" content="Bureau d'analyse football 3D">
<meta property="og:description" content="Bureau 3D interactif pour analyser les matchs de football. 11 employés, 3 salles, données vérifiées.">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0e14'/><circle cx='16' cy='16' r='6' fill='%23fb923c'/></svg>">
<style>
:root{--bg:#0a0e14;--card:#141a23;--ink:#eef1f5;--mut:#8b95a3;--line:#2a3340;--acc:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;overflow-x:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:linear-gradient(#0a0e14cc,#0a0e1400);z-index:10;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
#bar button{flex:none;background:#141a23ee;border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;transition:.2s;backdrop-filter:blur(6px)}
#bar button:hover{border-color:var(--acc);color:var(--acc)}
#bar button.h{background:var(--acc);color:#0a0e14;border-color:var(--acc);font-weight:700}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:#ffffffb0;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:52vh;overflow:auto;background:linear-gradient(#141a23,#0e1219);border-top:3px solid var(--acc);border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;max-width:760px;margin-inline:auto;box-shadow:0 -20px 60px #000a;z-index:20}
@media (orientation:landscape) and (max-height:560px){#sh{max-height:82vh}}
#sh.on{display:block;animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.hd{display:flex;gap:10px;align-items:center}
.hd input{font:inherit;font-weight:700;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mut)}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 2px}
#sh ul{margin:0;padding-left:18px}
.m{padding:7px 10px;border-radius:10px;max-width:92%;white-space:pre-wrap;margin-top:6px;font-size:13.5px;line-height:1.5}
.me{margin-left:auto;background:var(--acc);color:#0a0e14}
.ai{background:var(--bg);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:8px}
textarea{flex:1;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:none;width:100%}
input[type=text]{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
.go{background:var(--acc);color:#0a0e14;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
#load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100;transition:opacity .5s;color:var(--mut);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
#load.hide{opacity:0;pointer-events:none}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hint">Glisse pour tourner · pince pour zoomer · touche un employé</div>
<aside id="sh"></aside>
<div id="load"><div class="spin"></div><div>Chargement du studio</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(()=>{
"use strict";
if(!window.THREE){document.getElementById("load").innerHTML="Three.js n’a pas pu charger — vérifie la connexion.";return}

/* ============ DATA ============ */
const TAU = Math.PI*2;
const R = ["Direction & contrôle","Veille Web","Laboratoire de tests"];
const RX = [-9.3, 0, 9.3];
const ACCENT = [0xff7a3d, 0x38c4ff, 0xb066ff];
const TS = ["Teste les matchs à venir de ","Donne le résultat le plus probable avec un pourcentage estimé","Indique le scénario qui ferait échouer le pronostic"];
const ts=(t,x)=>({r:2,t,m:[TS[0]+x,TS[1],TS[2]],g:"Un résultat probable honnête, pas une certitude."});
const A = [
 {r:0,t:"Directeur — chef d’équipe",f:"Docteur en analyse, économie, gestion et finance",m:["Répartit le travail entre les trois salles","Croise les avis et écarte les pronostics fragiles","Rend la décision finale, avec ses raisons"],g:"Décider avec rigueur : savoir refuser un pari fait partie du métier."},
 {r:0,t:"Parieur",f:"Comparaison cote / probabilité",m:["Transforme les analyses en choix de marché","Compare la cote affichée à la probabilité estimée","Tient le bilan réel : 0 pari enregistré"],g:"Chercher un avantage positif sur la durée."},
 {r:0,t:"Contrôleur du code promo",f:"Lecture des conditions",m:["Lit les conditions (mise minimale, délais, marchés exclus)","Signale les pièges avant utilisation","Rappelle qu’un bonus ne justifie jamais un pari"],g:"Que le code serve la personne, jamais l’inverse."},
 {r:1,t:"Traqueur : blessures et compositions",f:"Sites des clubs, ligues, UEFA, médias reconnus",m:["Relève blessés, suspendus, compositions probables","Vérifie chaque info sur deux sources","Date et source pour chaque information"],g:"Rien d’inventé, rien de non vérifié."},
 {r:1,t:"Traqueur : forme et statistiques",f:"Sites statistiques spécialisés",m:["Cinq derniers matchs, domicile / extérieur, xG","Classements, enjeu, fatigue, calendrier","Signale les données manquantes"],g:"Des chiffres fiables et datés."},
 {r:1,t:"Traqueur : cotes et marchés",f:"Site Pariez Cash, actualités publiques",m:["Relève les cotes et l’heure de vérification","Suit les mouvements de cotes","Écarte les rumeurs anonymes"],g:"Des cotes réelles, jamais devinées."},
 ts("Testeur Liga","la Liga"),ts("Testeur Premier League","la Premier League"),ts("Testeur Ligue des champions","la Ligue des champions"),
 {r:2,t:"Testeur modèle de buts",f:"Modèle de Poisson",m:["Estime les buts attendus de chaque équipe","Calcule scores probables et plus/moins 2,5","Précise quand les données sont insuffisantes"],g:"Des chiffres prudents, jamais gonflés."},
 {r:2,t:"Testeur scénarios",f:"Favorable / neutre / défavorable",m:["Rejoue chaque match dans trois scénarios","Mesure l’effet d’une absence ou de la fatigue","Dit quand le pronostic ne tient plus"],g:"Voir les failles avant le match."}
];

/* ============ STATE (persisted) ============ */
let N = ["Abdarrahim","Abdoulaye","Abakar","Oumar","Marwan","Abdel Latif","Mahmoud","Abba","Elyou","",""];
let REP = null;
const H = {};

function loadState(){
  try{const s = JSON.parse(localStorage.getItem("bn3")||"null"); if(s&&Array.isArray(s)&&s.length===11) N=s;}catch(e){}
  try{const s = JSON.parse(localStorage.getItem("bn3_infos")||"null"); if(s&&typeof s==="object") REP=s;}catch(e){}
  try{const s = JSON.parse(localStorage.getItem("bn3_chat")||"null"); if(s&&typeof s==="object") Object.assign(H,s);}catch(e){}
}
function saveNames(){try{localStorage.setItem("bn3",JSON.stringify(N));}catch(e){}}
function saveInfos(){try{localStorage.setItem("bn3_infos",JSON.stringify(REP));}catch(e){}}
function saveChat(){try{
  const trimmed={}; Object.keys(H).forEach(k=>{trimmed[k]=H[k].slice(-20);});
  localStorage.setItem("bn3_chat",JSON.stringify(trimmed));
}catch(e){}}
loadState();

const nm = i => N[i] || "À nommer";

/* ============ RENDERER ============ */
const ren = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.outputEncoding = THREE.sRGBEncoding;
ren.toneMapping = THREE.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.15;
document.body.prepend(ren.domElement);
const cv = ren.domElement;

const sc = new THREE.Scene();
sc.fog = new THREE.Fog(0xa9cbe8, 40, 120);
const cam = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 300);

/* ============ LIGHTS ============ */
sc.add(new THREE.HemisphereLight(0xbcd7ff, 0x6b5a44, .9));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
sun.position.set(14, 24, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-24, right:24, top:16, bottom:-16, near:1, far:70});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sc.add(sun);
RX.forEach((x,i)=>{
  const l = new THREE.PointLight(ACCENT[i], 1.8, 12, 2);
  l.position.set(x, 4.2, 0);
  sc.add(l);
});

/* ============ SKY ============ */
const skyMat = new THREE.ShaderMaterial({
  uniforms:{topColor:{value:new THREE.Color(0x2a5fa8)},midColor:{value:new THREE.Color(0x8fc4f0)},botColor:{value:new THREE.Color(0xffd8a8)}},
  vertexShader:`varying vec3 vP; void main(){vP=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP; uniform vec3 topColor,midColor,botColor;
    void main(){float h=normalize(vP).y;vec3 c=h>0.0?mix(midColor,topColor,pow(h,0.7)):mix(midColor,botColor,pow(-h,0.6));gl_FragColor=vec4(c,1.);}`,
  side: THREE.BackSide, depthWrite:false
});
sc.add(new THREE.Mesh(new THREE.SphereGeometry(120,32,16), skyMat));

/* ============ TEXTURES ============ */
function procTex(fn,rep=1){
  const c=document.createElement("canvas");c.width=c.height=512;fn(c.getContext("2d"));
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=4;t.encoding=THREE.sRGBEncoding;
  return t;
}
const woodTex = procTex(g=>{
  for(let i=0;i<20;i++){g.fillStyle=`hsl(28,${30+Math.random()*15}%,${32+Math.random()*14}%)`;g.fillRect(0,i*26,512,25);}
  for(let i=0;i<900;i++){g.fillStyle="rgba(40,20,5,.12)";g.fillRect(Math.random()*512,Math.random()*512,30+Math.random()*80,1);}
},6);
const wallTex = procTex(g=>{
  g.fillStyle="#e8dfd0";g.fillRect(0,0,512,512);
  for(let i=0;i<3000;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*0.03})`;g.fillRect(Math.random()*512,Math.random()*512,2,2);}
},4);

const M = (c,o) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.72, metalness:.05}, o||{}));
const floorMat = new THREE.MeshStandardMaterial({map:woodTex, roughness:.35, metalness:.15, envMapIntensity:1.1});
const wallMat = new THREE.MeshStandardMaterial({map:wallTex, roughness:.9, metalness:0});
const deskMat = new THREE.MeshStandardMaterial({map:woodTex, roughness:.5, metalness:.1, envMapIntensity:.7});
const metalMat = M(0x2a2f38, {roughness:.4, metalness:.6});

/* ============ ROOM ============ */
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400,400), M(0x557a4f,{roughness:1}));
grass.rotation.x = -Math.PI/2; grass.position.y = -0.06; grass.receiveShadow = true;
sc.add(grass);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,12), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
sc.add(floor);

RX.forEach((x,i)=>{
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(7,5), M(ACCENT[i], {roughness:.95, metalness:0}));
  rug.rotation.x = -Math.PI/2; rug.position.set(x, .015, 2.4); rug.receiveShadow = true;
  sc.add(rug);
});

function wall(w,h,d,x,y,z,mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat||wallMat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; sc.add(m); return m;
}
wall(30,5,.3,0,2.5,-5.3);
wall(.3,5,12,-15,2.5,0);
wall(.3,5,12,15,2.5,0);
wall(30,.2,.35,0,.1,-5.15, M(0x3a2a1e));

const ceil = new THREE.Mesh(new THREE.PlaneGeometry(30,12), M(0x1a1f28, {roughness:.95}));
ceil.rotation.x = Math.PI/2; ceil.position.y = 5; ceil.receiveShadow = true;
sc.add(ceil);

RX.forEach(x=>{
  for(let i=-1;i<=1;i++){
    const strip = new THREE.Mesh(new THREE.BoxGeometry(3,.06,.25),
      new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:1.6, roughness:.3}));
    strip.position.set(x + i*2.2, 4.94, -2); sc.add(strip);
    const strip2 = strip.clone(); strip2.position.z = 2; sc.add(strip2);
  }
});

[-4.8, 4.8, -14.1, 14.1].forEach(x=>{
  const w = new THREE.Mesh(new THREE.PlaneGeometry(4,3),
    new THREE.MeshBasicMaterial({color:0xcfe8ff, transparent:true, opacity:.35}));
  w.position.set(x, 2.6, -5.14); w.rotation.y = Math.PI;
  sc.add(w);
});

[[-9.3,0x38c4ff],[0,0xff7a3d],[9.3,0xb066ff]].forEach(([x,c])=>{
  const shaft = new THREE.Mesh(new THREE.PlaneGeometry(6,5),
    new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:.05, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  shaft.position.set(x, 2.4, -4.6); sc.add(shaft);
});

RX.forEach((x,i)=>{
  const halo = new THREE.Mesh(new THREE.CircleGeometry(1.4,32),
    new THREE.MeshBasicMaterial({color:ACCENT[i], transparent:true, opacity:.15, blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.rotation.x = -Math.PI/2; halo.position.set(x, 4.9, 0);
  sc.add(halo);
});

/* ============ FURNITURE ============ */
function desk(x,z){
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.9,.07,.9), deskMat);
  top.position.y = .78; top.castShadow = top.receiveShadow = true; g.add(top);
  [[-0.86,-0.4],[0.86,-0.4],[-0.86,0.4],[0.86,0.4]].forEach(([dx,dz])=>{
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.06,.72,.06), metalMat);
    leg.position.set(dx,.36,dz); leg.castShadow = true; g.add(leg);
  });
  const monBase = new THREE.Mesh(new THREE.BoxGeometry(.3,.03,.2), metalMat);
  monBase.position.set(0,.82,-0.2); g.add(monBase);
  const monStand = new THREE.Mesh(new THREE.BoxGeometry(.05,.2,.05), metalMat);
  monStand.position.set(0,.92,-0.22); g.add(monStand);
  const monBezel = new THREE.Mesh(new THREE.BoxGeometry(.86,.52,.04), M(0x0a0a0a,{roughness:.4}));
  monBezel.position.set(0,1.2,-0.22); monBezel.castShadow = true; g.add(monBezel);
  const sk = document.createElement("canvas"); sk.width = 512; sk.height = 320;
  drawDash(sk.getContext("2d"), 512, 320);
  const tex = new THREE.CanvasTexture(sk); tex.encoding = THREE.sRGBEncoding;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(.78,.44),
    new THREE.MeshStandardMaterial({map:tex, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:.9, roughness:.2}));
  screen.position.set(0,1.2,-0.199); g.add(screen);
  const kb = new THREE.Mesh(new THREE.BoxGeometry(.5,.02,.18), M(0x1a1a1a,{roughness:.6}));
  kb.position.set(0,.82,.15); g.add(kb);
  const mouse = new THREE.Mesh(new THREE.SphereGeometry(.04,10,8), M(0x1a1a1a,{roughness:.5}));
  mouse.scale.set(1,.5,1.4); mouse.position.set(.36,.82,.15); g.add(mouse);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(.55,.06,.55), M(0x1e242e,{roughness:.85}));
  seat.position.set(0,.44,.85); seat.castShadow = true; g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(.55,.65,.06), M(0x1e242e,{roughness:.85}));
  back.position.set(0,.76,1.13); back.castShadow = true; g.add(back);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.36,10), metalMat);
  post.position.set(0,.25,.85); g.add(post);
  const star = new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.05,5), metalMat);
  star.position.set(0,.07,.85); g.add(star);
  g.position.set(x, 0, z);
  sc.add(g);
}

function drawDash(g, W, H){
  g.fillStyle = "#0a1622"; g.fillRect(0,0,W,H);
  g.fillStyle = "#fb923c"; g.fillRect(0,0,W,28);
  g.fillStyle = "#0a1622"; g.font = "bold 14px system-ui";
  g.fillText("LIVE · ANALYSE", 12, 19);
  const colors = ["#fb923c","#38c4ff","#b066ff","#4ade80","#f87171"];
  for(let i=0;i<7;i++){
    const h = 40 + Math.random()*90;
    g.fillStyle = colors[i%5];
    g.fillRect(20 + i*45, 200 - h, 30, h);
  }
  g.strokeStyle = "#38c4ff"; g.lineWidth = 2; g.beginPath();
  for(let i=0;i<10;i++){
    const x = 20 + i*45, y = 260 + Math.sin(i*.7)*20 + (Math.random()-.5)*15;
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.stroke();
  g.fillStyle = "#fff"; g.font = "bold 12px system-ui";
  g.fillText("xG 1.82", 20, 300);
  g.fillStyle = "#9aa0a8"; g.font = "11px system-ui";
  g.fillText("PROB 62%", 200, 300);
  g.fillText("BTTS OUI", 360, 300);
  const grd = g.createRadialGradient(W-40, 40, 0, W-40, 40, 120);
  grd.addColorStop(0, "rgba(56,196,255,.35)");
  grd.addColorStop(1, "rgba(56,196,255,0)");
  g.fillStyle = grd; g.fillRect(0,0,W,H);
}

function plant(x,z){
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.26,.3,.5,20), M(0x7a3d1f,{roughness:.85}));
  pot.position.set(x,.25,z); pot.castShadow = true; sc.add(pot);
  for(let i=0;i<6;i++){
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(.32,10,8), M(i%2?0x2f7d3b:0x3a9448,{roughness:.85}));
    leaf.position.set(x + Math.cos(i)*.15, .75 + i*.15, z + Math.sin(i)*.15);
    leaf.castShadow = true; sc.add(leaf);
  }
}
function board(x,z){
  const back = new THREE.Mesh(new THREE.BoxGeometry(2.8,1.6,.05), M(0xfafafa,{roughness:.4}));
  back.position.set(x,1.6,z); back.castShadow = true; sc.add(back);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.9,1.7,.04), metalMat);
  frame.position.set(x,1.6,z-.01); sc.add(frame);
  for(let i=0;i<4;i++){
    const line = new THREE.Mesh(new THREE.BoxGeometry(1.4+Math.random()*.6,.02,.001), M(i%2?0x2563eb:0xdc2626,{roughness:.5}));
    line.position.set(x + (Math.random()-.5)*.4, 1.9 - i*.3, z+.03);
    sc.add(line);
  }
  const pole = new THREE.Mesh(new THREE.BoxGeometry(.06,1.4,.06), metalMat);
  pole.position.set(x,.6,z); sc.add(pole);
}
function coffee(x,z){
  const body = new THREE.Mesh(new THREE.BoxGeometry(1,.9,.6), M(0x1a1f28,{roughness:.5, metalness:.3}));
  body.position.set(x,.45,z); body.castShadow = true; sc.add(body);
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.02,.08,.62), M(0x333b47,{roughness:.4, metalness:.5}));
  top.position.set(x,.94,z); sc.add(top);
  const noz = new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.15,10), metalMat);
  noz.position.set(x+.25,.86,z+.3); sc.add(noz);
  const glow = new THREE.Mesh(new THREE.BoxGeometry(.9,.05,.02),
    new THREE.MeshStandardMaterial({color:0x38c4ff, emissive:0x38c4ff, emissiveIntensity:2}));
  glow.position.set(x,.55,z+.31); sc.add(glow);
}
function roundTable(x,z){
  const t = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.1,32), deskMat);
  t.position.set(x,.76,z); t.castShadow = t.receiveShadow = true; sc.add(t);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.1,.15,.7,16), metalMat);
  base.position.set(x,.35,z); sc.add(base);

function standPose(p){
  p.g.position.y = 0;
  p.legL.hip.rotation.x = 0; p.legR.hip.rotation.x = 0;
  p.legL.knee.rotation.x = 0; p.legR.knee.rotation.x = 0;

function tick(p,dt,T){
  const g = p.g;
  const br = Math.sin(T*2 + p.ph) * 0.008;
  p.torso.scale.set(1 + br, 1 + br, 1 + br);
  if(p.st === "sit"){
    p.armL.elbow.rotation.x = -.4 + Math.sin(T*8 + p.ph) * .1;
    p.armR.elbow.rotation.x = -.4 + Math.cos(T*8 + p.ph) * .1;
    p.head.rotation.y = Math.sin(T*.8 + p.ph) * .25;
    p.t -= dt;
    if(p.t < 0){
      standPose(p);
      const s = SP[A[p.i].r];
      const w = s[Math.floor(Math.random()*s.length)];
      go(p, p.d[0], p.d[1] + 1.7);
      go(p, w[0] + (Math.random()-.5)*.6, w[1]);
      p.st = "walk"; p.next = "idle";
    }
    return;
  }
  if(p.st === "idle"){
    p.t -= dt;
    g.rotation.y = p.baseY + Math.sin(T*.8 + p.ph) * .3;
    p.armL.sh.rotation.z = Math.sin(T*1.5 + p.ph) * .08;
    p.armR.sh.rotation.z = Math.sin(T*1.5 + p.ph + 1) * .08;
    p.head.rotation.y = Math.sin(T*.6 + p.ph) * .35;
    if(p.t < 0){
      p.armL.sh.rotation.z = 0; p.armR.sh.rotation.z = 0;
      go(p, p.d[0], p.d[1] + 1.7);
      go(p, p.d[0], p.d[1] + .85);
      p.st = "walk"; p.next = "sit";
    }
    return;
  }
  const q = p.q[0];
  if(!q){
    if(p.next === "sit"){
      g.rotation.y = Math.PI;
      sitPose(p);
      p.st = "sit"; p.t = 8 + Math.random()*14;
    } else {
      p.baseY = g.rotation.y;
      p.st = "idle"; p.t = 3 + Math.random()*4;
    }
    p.legL.hip.rotation.x = 0; p.legR.hip.rotation.x = 0;
    p.legL.knee.rotation.x = 0; p.legR.knee.rotation.x = 0;
    p.armL.sh.rotation.x = 0; p.armR.sh.rotation.x = 0;
    return;
  }
  const dx = q[0] - g.position.x, dz = q[1] - g.position.z;
  const d = Math.hypot(dx, dz);
  if(d < .08){ p.q.shift(); return; }
  const a = Math.atan2(dx, dz);
  let df = a - g.rotation.y;
  df = Math.atan2(Math.sin(df), Math.cos(df));
  g.rotation.y += df * Math.min(1, dt*9);
  const sp = Math.min(d, 1.4 * dt);
  g.position.x += dx/d * sp;
  g.position.z += dz/d * sp;
  p.ph += dt * 9;
  const s = Math.sin(p.ph) * .7;
  p.legL.hip.rotation.x = s; p.legR.hip.rotation.x = -s;
  p.legL.knee.rotation.x = Math.max(0, -s) * .8;
  p.legR.knee.rotation.x = Math.max(0, s) * .8;
  p.armL.sh.rotation.x = -s * .7; p.armR.sh.rotation.x = s * .7;
}

function detect(q){
  const l = q.toLowerCase();
  return {
    pred: /pronostic|prédiction|pari|résultat|probable|chance|gagner|mise|parier/.test(l),
    data: /cote|classement|bless|xg|stat|forme|composition|effectif|donnée|info/.test(l),
    code: /code|promo|bonus/.test(l),
    meth: /comment|pourquoi|méthode|calcul|modèle|fonctionne|explique|procède|marche/.test(l),
    team: /équipe|tout le monde|ensemble|résume|qui fait quoi/.test(l),
    bilan: /bilan|résultat|gains|pertes|historique/.test(l),
    help: /aide|help|utiliser|démarrer|commencer/.test(l)
  };
}

function localReply(idx, q){
  const d = detect(q);
  if(idx < 0){
    const parts = ["🏛️ Directeur : " + PER[0].pred, "💰 Parieur : " + PER[1].pred, "🎯 Testeur buts : " + PER[9].pred];
    return parts.join("\n\n") + "\n\n" + DISCLAIMER + "\n\n" + NO_DATA;
  }
  const p = PER[idx] || {};
  if(d.help) return "Je suis " + nm(idx) + ", " + A[idx].t + ".\n\n" + (p.meth || p.fallback) + "\n\n" + NO_DATA;
  if(d.team && p.team) return p.team;
  if(d.code && p.code) return p.code;
  if(d.meth && p.meth) return p.meth;
  if(d.bilan && p.bilan) return p.bilan;
  if(d.pred && p.pred) return p.pred + "\n\n" + DISCLAIMER;
  if(d.data && p.data) return p.data + "\n\n" + NO_DATA;
  return (p.fallback || "Pose ta question sur un match, un pronostic, un code promo, ou demande-moi comment je procède.") + "\n\n" + NO_DATA;
}

function renderInfosEditor(){

  dateInp.placeholder = new Date().toLocaleDateString("fr-FR");

  ta.rows = 6;
  ta.placeholder = "Liga : Real - Barça samedi 21h\nPremier : United - Liverpool dimanche 17h\nBlessure : Vinicius out 2 semaines…";
  ta.value = lines.join("\n");
  sh.append(ta);

  const btn = document.createElement("button");
  btn.className = "go"; btn.textContent = "Mettre à jour l'écran";
  btn.style.cssText = "margin-top:10px;width:100%";
  btn.onclick = ()=>{
    REP = {
      date: dateInp.value.trim() || new Date().toLocaleDateString("fr-FR"),

    btn.textContent = "✓ Écran mis à jour";

  div("k", "Astuce");

}

async function ask(i, ta, log){
  const q = ta.value.trim(); if(!q) return;
  ta.value = "";
  div("m me", q, log);
  const w = div("m ai", "…", log);
  H[i] = H[i] || [];
  H[i].push(["me", q]);
  await new Promise(r=>setTimeout(r, 350 + Math.random()*300));
  const reply = localReply(i, q);
  w.textContent = reply;
  H[i].push(["ai", reply]);
  saveChat();
}
